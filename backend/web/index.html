window.chatStart = async () => {
  if (chat.id) { $('#chat-mount').scrollIntoView({behavior:'smooth'}); return; }
  $('#chat-mount').innerHTML = `<div class="chat-shell" style="margin-top:14px">
    <div class="chat-head"><div class="dot"></div><div class="who">Skill 创作 Agent</div><div class="st" id="chat-state"></div></div>
    <div class="chat-body" id="chat-body">${loading('创作 Agent 正在接入…')}</div>
    <div class="chat-input">
      <textarea id="chat-in" placeholder="描述你想创建的 Skill：帮助谁、做什么、输入输出…（Ctrl+Enter 发送）"></textarea>
      <div class="chat-actions"><button class="act" id="chat-send" disabled>发送</button></div>
    </div></div>`;
  $('#chat-send').onclick = chatSend;
  $('#chat-in').onkeydown = e => { if (e.key==='Enter' && (e.ctrlKey||e.metaKey)) chatSend(); };
  try {
    const d = await api('/skills/dialog', {method:'POST'});
    chat = { id: d.dialog_id, state: d.state, draft: null };
    $('#chat-mount').dataset.dialogId = d.dialog_id;
    $('#chat-body').innerHTML = '';
    aiSay(d.question);
    renderState();
    $('#chat-send').disabled = false;   // 会话就绪后才允许发送
    $('#chat-in').focus();
  } catch (e) { $('#chat-body').innerHTML = `<div class="bubble ai">${esc('启动失败: '+e.message)}</div>`; }
};
function renderState() {
  const label = {clarify:'澄清需求中', draft:'草稿待确认', submitted:'已提交审核'}[chat.state] || chat.state;
  $('#chat-state').innerHTML = `<span class="badge-state ${chat.state}">${label}</span>`;
}
function aiSay(text) {
  $('#chat-body').insertAdjacentHTML('beforeend', `<div class="bubble ai">${esc(text)}</div>`);
  $('#chat-body').scrollTop = 1e9;
}
function meSay(text) {
  $('#chat-body').insertAdjacentHTML('beforeend', `<div class="bubble me">${esc(text)}</div>`);
  $('#chat-body').scrollTop = 1e9;
}
async function chatSend() {
  const inp = $('#chat-in');
  const text = inp.value.trim();
  if (!text) return;
  // 会话创建是异步的：手快时等待按钮启用（最多 10s），不静默丢消息
  const sendBtn = $('#chat-send');
  for (let i = 0; i < 50 && sendBtn?.disabled; i++) await new Promise(r => setTimeout(r, 200));
  const dialogId = chat.id || $('#chat-mount')?.dataset.dialogId || '';
  if (!dialogId) { toast('会话尚未就绪，请稍后再试'); return; }
  meSay(text); inp.value = '';
  const thinking = document.createElement('div');
  thinking.className = 'bubble ai'; thinking.innerHTML = loading('创作 Agent 正在思考…');
  $('#chat-body').appendChild(thinking); $('#chat-body').scrollTop = 1e9;
  try {
    const d = await api(`/skills/dialog/${dialogId}/reply`, {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({text})});
    chat.state = d.state; chat.draft = d;
    thinking.remove();
    if (d.state === 'draft' && d.draft_name) {
      $('#chat-body').insertAdjacentHTML('beforeend', `
        <div class="draft-card">
          <div class="dt">草稿已生成</div>
          <div class="kv"><b>name</b>${esc(d.draft_name)}</div>
          <div class="kv"><b>description</b>${esc(d.draft_description)}</div>
          <div class="kv"><b>instructions</b></div>
          <pre style="max-height:160px;margin-top:4px">${esc(d.draft_instructions)}</pre>
          <div class="row" style="margin:10px 0 0">
            <button class="act" onclick="chatSubmit()">确认并提交审核</button>
            <span style="font-size:12px;color:var(--dim);align-self:center">继续对话可修改草稿</span>
          </div>
        </div>`);
    } else {
      aiSay(d.history.at(-1)?.content || '（无回复）');
    }
    renderState(); $('#chat-body').scrollTop = 1e9;
  } catch (e) { thinking.innerHTML = esc('出错了: ' + e.message); }
}
window.chatSubmit = async () => {
  try {
    const r = await api(`/skills/dialog/${$('#chat-mount').dataset.dialogId || chat.id}/submit`, {method:'POST'});
    chat.state = 'submitted'; renderState();
    aiSay(`草稿已通过统一审核流水线发布为 Skill「${r.skill}」，可在下方列表查看。`);
    $('#chat-body').scrollTop = 1e9;
    setTimeout(refreshSkillCatalog, 500);
  } catch (e) { aiSay('提交失败: ' + e.message); }
};

function renderTree(nodes, prefix = '') {
  if (!nodes || !nodes.length) return '<div class="dim" style="font-size:12px">无文件</div>';
  const item = (n, base = prefix) => {
    const full = base ? base + '/' + n.name : n.name;
    if (n.type === 'file') {
      return `<div class="fi file-item" onclick="openSkillFile('${esc(window.__skName)}', '${esc(full)}')" title="点击查看并编辑">
        <span style="color:var(--acc)">${esc(n.name)}</span><span class="sz">${n.size ?? 0} B</span></div>`;
    }
    // 递归子目录时带上当前层路径
    const childBase = full;
    return `<div class="fi dir">${esc(n.name)}</div><div class="fl">${(n.children || []).map(c => item(c, childBase)).join('')}</div>`;
  };
  return `<div class="ftree">${nodes.map(n => item(n)).join('')}</div>`;
}

                   ContextCompressor:'上下文压缩', WorkflowNode:'工作流节点'};

window.refreshPlugins = async () => {

/* ── Agent 市场：独立下拉菜单（搜索+推荐）、团队、卡片列表 ── */
let AG_EDIT_ID = null;       // 非空表示"重新组装"模式
let TEAM_EDIT_ID = null;     // 非空表示"编辑团队"模式
let AG_SKILLS = [];          // 已选 Skill
let AG_PLUGINS = {};         // 已选插件 {slot: key}
const SLOT_OF = {MemoryProvider:'memory', ChunkingStrategy:'chunking',
                 IntentRecognizer:'intent', ContextCompressor:'compress', WorkflowNode:'workflow'};

window.loadAgentPickers = async () => {
  const sm = document.querySelector('#ag-skill-menu'), pm = document.querySelector('#ag-plugin-menu');
  if (!sm || !pm) return;
  sm.innerHTML = `<input id="ag-skill-q" placeholder="搜索 Skill…" style="width:100%">
    <div class="menu-list" id="ag-skill-list"></div>`;
  pm.innerHTML = `<input id="ag-plugin-q" placeholder="搜索插件…" style="width:100%">
    <div class="menu-list" id="ag-plugin-list"></div>`;
  await refreshMenuItems();
  $('#ag-skill-q').oninput = refreshMenuItems;
  $('#ag-plugin-q').oninput = refreshMenuItems;
  $('#ag-d').oninput = debounce(refreshRecommend, 500);
};
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

async function refreshMenuItems() {
  const sq = ($('#ag-skill-q')?.value || '').toLowerCase();
  const pq = ($('#ag-plugin-q')?.value || '').toLowerCase();
  const skills = await api('/skills').catch(() => []);
  const plugins = await api('/plugins/managed').catch(() => []);
  const sl = $('#ag-skill-list'), pl = $('#ag-plugin-list');
  if (sl) sl.innerHTML = skills.filter(s => !sq || (s.name+s.description).toLowerCase().includes(sq))
    .map(s => {
      const picked = AG_SKILLS.includes(s.name);
      return `<button class="menu-item" style="${picked?'color:var(--acc);font-weight:600':''}" onclick="agAddSkill('${esc(s.name)}')">${picked?'✓ ':''}${esc(s.name)} <span class="dim">${esc((s.description||'').slice(0,40))}</span></button>`;
    }).join('')
    || '<div class="dim" style="padding:8px">无匹配 Skill</div>';
  if (pl) pl.innerHTML = plugins.filter(p => p.enabled && (!pq || (p.key+p.name+p.description).toLowerCase().includes(pq)))
    .map(p => {
      const base = SLOT_OF[p.extension_point] || 'workflow';
      const isMulti = (base === 'workflow' || base === 'compress');
      const slotKey = isMulti ? `${base}:${p.key}` : base;
      const picked = AG_PLUGINS[slotKey] === p.key || AG_PLUGINS[base] === p.key;
      return `<button class="menu-item" style="${picked?'color:var(--acc);font-weight:600':''}" onclick="agAddPlugin('${esc(p.key)}','${esc(p.extension_point)}')">${picked?'✓ ':''}${esc(p.name)} <span class="tag">${esc(p.key)}</span>${isMulti?'<span class="tag acc" style="margin-left:4px">可叠加</span>':''}</button>`;
    }).join('')
    || '<div class="dim" style="padding:8px">无匹配插件</div>';
}
async function refreshRecommend() {
  const desc = $('#ag-d')?.value.trim();
  if (!desc) return;
  const rs = await api('/agents/recommend/skills', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({description: desc, limit: 3})}).catch(() => []);
  const rp = await api('/agents/recommend/plugins', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({description: desc, limit: 3})}).catch(() => []);
  const box = $('#ag-recommend') || (() => { const d=document.createElement('div'); d.id='ag-recommend'; d.className='recommend'; $('#ag-p').after(d); return d; })();
  box.innerHTML = `<div class="rt">根据描述推荐</div>` +
    (rs.length || rp.length ? rs.map(s=>`<button class="chip" onclick="agAddSkill('${esc(s.name)}')">+ ${esc(s.name)}</button>`).join('') +
      rp.map(p=>`<button class="chip" onclick="agAddPlugin('${esc(p.key)}','${esc(p.extension_point)}')">+ ${esc(p.name)}</button>`).join('')
      : '<span class="dim">暂无匹配推荐</span>');
}
let AG_PLUGIN_CONFIG = {};
window.agAddSkill = name => {
  if (!AG_SKILLS.includes(name)) AG_SKILLS.push(name);
  renderPicked();
};
window.agAddPlugin = (key, ep) => {
  const base = SLOT_OF[ep] || 'workflow';
  const slot = (base === 'workflow' || base === 'compress') ? `${base}:${key}` : base;
  AG_PLUGINS[slot] = key;
  renderPicked();
};
window.agConfigPlugin = async (slot, key) => {
  const cur = AG_PLUGIN_CONFIG[slot] || AG_PLUGIN_CONFIG[key] || {};
  const r = await modal({
    title: `覆盖插件参数 · ${key}`,
    confirmText: '保存参数',
    html: `<div class="d" style="margin-bottom:8px">仅对当前 Agent 生效，会覆盖插件默认配置（JSON 格式，如 <code>{"max_items": 8}</code> 或 <code>{"url": "http://...", "hooks": ["before_tool","after_llm"]}</code>）：</div>
      <textarea id="m-pcfg" style="min-height:130px;font-family:monospace;font-size:12px">${esc(JSON.stringify(cur, null, 2))}</textarea>`,
    collect: { raw: '#m-pcfg' },
  });
  if (!r) return;
  try {
    const parsed = JSON.parse((r.raw || '{}').trim() || '{}');
    if (typeof parsed !== 'object' || Array.isArray(parsed) || parsed === null) throw new Error('必须是 JSON 对象');
    if (Object.keys(parsed).length) AG_PLUGIN_CONFIG[slot] = parsed;
    else { delete AG_PLUGIN_CONFIG[slot]; delete AG_PLUGIN_CONFIG[key]; }
    renderPicked();
    toastQuick(`已保存 ${key} 参数覆盖`, true);
  } catch (e) { toast('JSON 格式错误：' + e.message, '保存失败'); }
};
function renderPicked() {
  const sp = $('#ag-skills-picked'), pp = $('#ag-plugins-picked');
  if (sp) sp.innerHTML = AG_SKILLS.map(s=>`<span class="chip on">${esc(s)} <button onclick="event.stopPropagation();agRemoveSkill('${esc(s)}')">×</button></span>`).join('');
  if (pp) pp.innerHTML = Object.entries(AG_PLUGINS).map(([slot,k])=>{
    const hasCfg = Boolean((AG_PLUGIN_CONFIG[slot] && Object.keys(AG_PLUGIN_CONFIG[slot]).length) || (AG_PLUGIN_CONFIG[k] && Object.keys(AG_PLUGIN_CONFIG[k]).length));
    return `<span class="chip on">${esc(slot)}: ${esc(k)} <button title="配置该 Agent 的独立插件参数" style="font-size:11px;opacity:${hasCfg?1:0.75}" onclick="event.stopPropagation();agConfigPlugin('${esc(slot)}','${esc(k)}')">${hasCfg?'⚙已配':'⚙'}</button><button onclick="event.stopPropagation();agRemovePlugin('${esc(slot)}')">×</button></span>`;
  }).join('');
  refreshMenuItems();
}
window.agRemoveSkill = name => { AG_SKILLS = AG_SKILLS.filter(x=>x!==name); renderPicked(); };
window.agRemovePlugin = slot => { const k = AG_PLUGINS[slot]; delete AG_PLUGINS[slot]; delete AG_PLUGIN_CONFIG[slot]; if (k) delete AG_PLUGIN_CONFIG[k]; renderPicked(); };

function resetAgentForm() {
  AG_EDIT_ID = null; AG_SKILLS = []; AG_PLUGINS = {}; AG_PLUGIN_CONFIG = {};
  ['ag-n','ag-d','ag-p'].forEach(id => { if ($('#'+id)) $('#'+id).value=''; });
  renderPicked();
  const rec = $('#ag-recommend'); if (rec) rec.remove();
  const note = $('#ag-edit-note'); if (note) note.textContent='';
  const cancel = $('#ag-cancel-btn'); if (cancel) cancel.classList.add('hidden');
  const btn = $('#ag-submit-btn'); if (btn) btn.textContent='校验并发布';
}

window.agCreate = async () => {
  const body = {
    name: $('#ag-n').value.trim(), description: $('#ag-d').value.trim(),
    system_prompt: $('#ag-p').value, skill_keys: AG_SKILLS, plugin_keys: AG_PLUGINS,
    plugin_config: AG_PLUGIN_CONFIG,
  };

  try {
    let a;
    if (AG_EDIT_ID) {
      a = await api(`/agents/${AG_EDIT_ID}`, {method:'PUT', headers:{'content-type':'application/json'}, body: JSON.stringify(body)});
      flashMsg(box, true, `重新组装成功：${a.name}`);
    } else {
      a = await api('/agents', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body)});
      flashMsg(box, true, `发布成功：${a.name} v${a.version}`);

window.agEdit = async (id) => {
  const a = (await api('/agents').catch(()=>[])).find(x=>x.id===id);
  if (!a) return;
  clearMsg($('#ag-msg'));
  AG_EDIT_ID = id; AG_SKILLS = [...(a.skill_keys||[])]; AG_PLUGINS = {...(a.plugin_keys||{})}; AG_PLUGIN_CONFIG = {...(a.plugin_config||{})};

window.agDelete = async (id) => {
  const a = (await api('/agents').catch(()=>[])).find(x=>x.id===id);

  if (!(await modal({title:'删除 Agent', message:`确定删除「${a.name}」？`, confirmText:'删除', danger:true}))) return;

function renderAgentListData(list) {
  const el = $('#ag-list'); if (!el) return;

  el.innerHTML = list.length ? list.map(a => {
    const deps = a.skill_keys.map(s=>`<span class="tag acc">${esc(s)}</span>`).join(' ')
      + Object.entries(a.plugin_keys).map(([k,v])=>`<span class="tag">${esc(k)}: ${esc(v)}</span>`).join(' ');
    return `<div class="ag-card">
      <div class="ag-head"><div class="ag-title">${esc(a.name)}</div><span class="tag">v${a.version}</span></div>
      <div class="ag-desc">${esc(a.description||'暂无介绍')}</div>
      <div class="ag-tags">${deps||'<span class="dim">无依赖</span>'}</div>
      <div class="ag-actions">
        <button class="pl-act" onclick="agPlay('${a.id}')">Playground</button>
        <button class="pl-act" onclick="agEval('${a.id}',this)">评测</button>
        <button class="pl-act" onclick="agCard('${esc(a.name)}',this)">Agent Card</button>

        <button class="pl-act del" onclick="agDelete('${a.id}')">删除</button>

  catch (e) { toast(e.message, '读取 Card 失败'); return; }
  const overlay = document.createElement('div');
  overlay.className = 'card-overlay';
  overlay.innerHTML = `
    <div class="co-head"><span>Agent Card</span><button class="co-close" title="关闭" onclick="this.closest('.card-overlay').remove()">×</button></div>

};

    }
    resetTeamForm();
    await refreshTeams();
    await refreshAgentList();
    await refreshTeamCandidates();
  } catch (e) { flashMsg(box, false, e.message); }
};

async function pgRun() {
  const inp = $('#pg-in'), text = inp.value.trim();
  if (!text) return;
  const aid = $('#pg-ag')?.value || PG_AGENT_ID;
  if (!aid) return;
  const hist = PG_CACHE[aid] || (PG_CACHE[aid] = []);
  if (hist.some(m => m.role === 'pending')) return;
  inp.value = '';
  inp.style.height = 'auto';
  const goBtn = $('#pg-go');
  if (goBtn) goBtn.disabled = true;
  // 先取历史（不含当前消息与占位），发给后端让 Agent 有上下文
  const history = hist.filter(m => (m.role === 'user' || m.role === 'assistant') && m.content)
    .map(m => ({role: m.role, content: m.content}));
  // 写入该 Agent 的缓存（页面切换不丢）
  hist.push({role:'user', content:text});
  const pending = {role:'pending'};
  hist.push(pending);   // 思考中占位：显示转圈
  window.__pgLive = {aid, events: []};
  renderPGChat();
  const refreshLive = () => { if (PG_AGENT_ID === aid) renderPGChat(); };
  try {
    const resp = await fetch(`/agents/${aid}/playground/stream`, {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({input: text, history}),
    });
    if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);
    const reader = resp.body.getReader(), dec = new TextDecoder();
    let buf = '', finalReply = '', finalSteps = [], finalStatus = 'succeeded', finalUsage = {}, finalThoughts = [], finalFiles = [];
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
        for (const line of frame.split('\n')) {
          if (!line.startsWith('data:')) continue;
          let ev; try { ev = JSON.parse(line.slice(5)); } catch { continue; }
          window.__pgLive.events.push(ev);
          if ((ev.type === 'thought' || ev.type === 'reasoning') && ev.text) finalThoughts.push(ev.text);
          if (ev.type === 'file') finalFiles.push(ev);
          if (ev.type === 'done') {
            finalReply = ev.output || ''; finalSteps = ev.steps || [];
            finalStatus = ev.status || 'succeeded'; finalUsage = ev.token_usage || {};
          }
          refreshLive();
        }
      }
    }
    const idx = hist.indexOf(pending);
    if (idx >= 0) hist.splice(idx, 1);
    hist.push({role:'assistant', content: finalReply || '（未生成内容）', files: finalFiles,
               thoughts: finalThoughts, status: finalStatus, steps: finalSteps, token_usage: finalUsage});
    refreshLive();
  } catch (e) {
    const idx = hist.indexOf(pending);
    if (idx >= 0) hist.splice(idx, 1);
    hist.push({role:'assistant', content: '失败: ' + e.message, status:'failed'});
    refreshLive();
  } finally {
    window.__pgLive = null;
    if (goBtn && PG_AGENT_ID === aid) goBtn.disabled = false;
  }
}
window.peDiscover = async () => {
  const url = $('#pe-u')?.value.trim();
  const box = $('#pe-preview');
  if (!url) { flashMsg($('#pe-msg'), false, '请先填写 Base URL'); return; }
  box.innerHTML = loading('正在读取 Agent Card…');
  try {
    const card = await api('/a2a/peers/discover', {method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({base_url: url, auth_token: $('#pe-token')?.value.trim() || ''})});
    if (!card.ok) {
      box.innerHTML = `<div class="d" style="color:var(--warn);font-size:12px;margin-top:8px">自动识别失败：${esc(card.error||'')}。可在下方手动填写名称与简介后注册。</div>`;
      return;
    }
    window.__peCard = card;
    box.innerHTML = `<div class="card" style="margin-top:8px;border-color:var(--ok)">
      <div class="t" style="font-size:13px">识别结果 <span class="tag ok">来自 Agent Card</span></div>
      <div class="d" style="font-size:12.5px;margin:4px 0"><b>名称：</b>${esc(card.name||'')} <span class="dim">（版本 ${esc(card.version||'')}）</span></div>
      <div class="d" style="font-size:12.5px"><b>简介：</b>${esc(card.description||'')}</div>
      <div class="d" style="font-size:12px;margin-top:4px;color:var(--dim)">发现地址：${esc(card.card_url||'')}</div>
      ${(card.skills||[]).length?`<div class="ag-tags" style="margin-top:6px">${card.skills.map(s=>`<span class="tag acc" title="${esc(s.description||'')}">${esc(s.name||s.id)}</span>`).join('')}</div>`:''}
    </div>`;
    toastQuick('自动识别成功，信息已带回', true);
  } catch (e) { box.innerHTML = msg(false, e.message); }
};

window.docAdd = async () => {
  try {
    const r = await api('/rag/documents', {method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({title:$('#doc-t').value.trim(), content:$('#doc-c').value})});

window.docToggleCustom = () => {
  const box = $('#doc-params'); if (box) box.classList.toggle('hidden', $('#doc-genre')?.value !== 'custom');
  window.__docPreview = null;
  if ($('#doc-preview')) $('#doc-preview').innerHTML = '';
};
window.docPreview = async () => {
  const f = $('#doc-file')?.files?.[0];
  if (!f) { flashMsg($('#doc-msg'), false, '请先选择要上传的文件'); return; }
  const box = $('#doc-preview');
  box.innerHTML = loading('解析并预览分块中…');
  try {
    const fd = new FormData(); fd.append('file', f);
    fd.append('genre', $('#doc-genre')?.value || '');
    fd.append('chunk_size', parseInt($('#doc-size')?.value)||500);
    fd.append('overlap', parseInt($('#doc-overlap')?.value)||50);
    const r = await api('/rag/documents/preview', {method:'POST', body: fd});
    window.__docPreview = {f, result: r};
    // 自动识别仅作提示；用户下拉值优先
    const sug = r.suggestion || {};
    $('#doc-detect').innerHTML = `<div class="d" style="margin-top:10px;font-size:12px">
      自动识别建议：<b>${esc(sug.genre_label||'未知')}</b>（置信度 ${sug.confidence??0}）· ${esc(sug.reason||'')}
      ${sug.confidence < 0.6 ? '<span style="color:var(--warn)"> 置信度较低，建议手动指定</span>' : ''}</div>`;
    box.innerHTML = `<div class="d" style="margin:10px 0">体裁：<b>${esc(r.genre_label)}</b> · 共 ${r.chunk_count} 块${r.truncated?'（仅显示前30块）':''}</div>
      <div class="ag-list-view" style="max-height:260px">${r.chunks.map(c=>
        `<div class="card" style="margin-bottom:6px"><div class="t" style="font-size:12px">块 ${c.chunk_index+1} · ${esc(c.kind)} · ${esc(JSON.stringify(c.locator))}</div>
         <div class="d" style="font-size:12px;white-space:pre-wrap">${esc(c.text.slice(0,220))}${c.text.length>220?'…':''}</div></div>`).join('')}</div>
      <div class="row" style="margin-top:10px"><button class="act" onclick="docConfirm(this)">确认入库</button>
        <button class="ghost" onclick="document.querySelector('#doc-preview').innerHTML=''">取消</button></div>`;
  } catch (e) { box.innerHTML = msg(false, e.message); }
};
window.docConfirm = async (btn) => {
  const p = window.__docPreview; if (!p) return;
  const fd = new FormData(); fd.append('file', p.f);
  fd.append('genre', $('#doc-genre')?.value || '');
  fd.append('chunk_size', $('#doc-size')?.value || '500');
  fd.append('overlap', $('#doc-overlap')?.value || '50');
  // 显示转圈加载，禁用按钮防重复提交
  if (btn) { btn.disabled = true; }
  $('#doc-msg').innerHTML = `<div class="loading-box"><span class="spinner"></span>正在入库：分块、向量化并写入知识库…</div>`;
  try {
    const r = await api('/rag/documents/upload', {method:'POST', body: fd});
    flashMsg($('#doc-msg'), true, `「${p.f.name}」入库成功：${r.genre_label}（${r.genre_source==='user'?'手动指定':'自动识别'}），切分 ${r.chunk_count} 块`);
    $('#doc-file').value=''; $('#doc-preview').innerHTML=''; $('#doc-detect').innerHTML='';
    $('#doc-file-name').textContent='未选择文件（txt / md / pdf / docx / xlsx / csv / json / log）';
    window.__docPreview = null;
    await refreshDocList();
  } catch (e) {
    flashMsg($('#doc-msg'), false, e.message);
    if (btn) { btn.disabled = false; }
  }
};
async function refreshDocList() {
  const el = $('#doc-list'); if (!el) return;
  const docs = await api('/rag/documents').catch(()=>[]);
  const STRAT = {'markdown-heading':'按标题层级', 'page-aware':'按页', 'paragraph':'按段落', 'row-aware':'按行', 'line-aware':'按行', 'fixed-window':'固定窗口'};
  // 按文件类型选图标与颜色（仿 Windows 资源管理器）
  const TYPE_ICON = {
    '.pdf': {label:'PDF', cls:'ft-pdf'}, '.docx': {label:'DOC', cls:'ft-doc'},
    '.xlsx': {label:'XLS', cls:'ft-xls'}, '.csv': {label:'CSV', cls:'ft-xls'},
    '.md': {label:'MD', cls:'ft-md'}, '.markdown': {label:'MD', cls:'ft-md'},
    '.json': {label:'{}', cls:'ft-json'}, '.log': {label:'LOG', cls:'ft-txt'},
    '.txt': {label:'TXT', cls:'ft-txt'},
  };
  const icon = f => { const t = TYPE_ICON[f] || TYPE_ICON['.txt']; return `<span class="filetype ${t.cls}">${t.label}</span>`; };
  if (!docs.length) { el.innerHTML = '<div class="empty">暂无文档，上传一个文件试试</div>'; return; }
  el.innerHTML = `<div class="file-explorer">
    <div class="fe-head"><span>名称</span><span>类型</span><span>分块策略</span><span>片段</span><span>上传日期</span><span>操作</span></div>
    ${docs.map(d => {
      const ft = d.file_type || '.txt';
      const date = (d.created_at||'').slice(0,16);
      return `<div class="fe-row" ondblclick="docOpen('${d.id}')">
        <span class="fe-name" onclick="docOpen('${d.id}')" title="双击打开">${icon(ft)}<span>${esc(d.source_filename||d.title||d.id)}</span></span>
        <span class="fe-cell">${esc(ft.toUpperCase())}</span>
        <span class="fe-cell"><span class="tag acc">${esc(STRAT[d.chunk_strategy]||'自动')}</span></span>
        <span class="fe-cell">${d.chunk_count}</span>
        <span class="fe-cell dim">${esc(date)}</span>
        <span class="fe-cell"><button class="pl-act del" onclick="docDelete('${d.id}','${esc(d.title||d.id)}')">删除</button></span>
      </div>`;
    }).join('')}
  </div>`;
}
window.docDelete = async (id, title) => {
  if (!(await modal({title:'删除文档', message:`确定删除文档「${title}」及其向量索引？`, confirmText:'删除', danger:true}))) return;
  try {
    await api(`/rag/documents/${id}`, {method:'DELETE'});
    if ($('#doc-detail')) $('#doc-detail').innerHTML='';
    await refreshDocList();
  } catch (e) { toast(e.message, '删除失败'); }
};
window.docOpen = async id => {
  const box = $('#doc-detail'); if (!box) return;
  try {
    const d = await api(`/rag/documents/${id}`);
    box.innerHTML = `<div class="card" style="margin-top:16px">
      <div class="ag-head"><div class="ag-title">${esc(d.title)} <span class="tag">${esc(d.file_type)}</span></div>
        <button class="co-close" title="关闭" onclick="document.querySelector('#doc-detail').innerHTML=''">×</button></div>
      <div class="d" style="font-size:12px;color:var(--dim);margin:6px 0 10px">
        源文件：${esc(d.source_filename||'-')} · 分块策略：${esc(d.chunk_strategy)} · ${d.chunk_count} 片段 · 完整内容
      </div>
      <pre style="max-height:520px;white-space:pre-wrap;word-break:break-word">${esc(d.content)}</pre>
    </div>`;
    box.scrollIntoView({behavior:'smooth', block:'nearest'});
  } catch (e) { box.innerHTML = msg(false, e.message); }
};
window.qGo = async () => {
  try {
    const r = await api('/rag/search', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({content:$('#q-in').value})});
    const head = `<div class="d" style="font-size:11.5px;color:var(--dim);margin:8px 0">
      混合检索（向量+BM25 · RRF融合） · 阈值 ${r.threshold} · top_k ${r.top_k} · 候选 ${r.candidates} → 保留 ${r.kept}</div>`;
    $('#q-out').innerHTML = head + (r.hits.length ? r.hits.map(h =>
      `<div class="card" style="margin-top:6px"><div class="t" style="font-size:13px">${esc(h.title)}
         <span class="tag acc">相关度 ${(h.relevance??0).toFixed(3)}</span>
         <span class="tag">RRF ${(h.score??0).toFixed(4)}</span>
         <span class="tag">BM25 ${(h.bm25_score??0).toFixed(1)}</span>
         ${r.reranked?'<span class="tag ok">已重排</span>':''}</div>
       <div class="d">${esc(h.text.slice(0,180))}…</div></div>`).join('') : '<div class="empty">无命中（相关性未达到阈值）</div>');
  } catch (e) { $('#q-out').innerHTML = msg(false, e.message); }
};
