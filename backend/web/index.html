<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent 工作系统</title>
<style>
/* ── 主题变量：Midnight Obsidian & Porcelain Mist ── */
:root {
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --radius-sm: 8px;
  --radius-md: 13px;
  --radius-lg: 18px;
}
:root[data-theme="dark"] {
  --bg:#080a0f; --bg2:#0e121b; --panel:#121723; --panel2:#181e2e; --panel-glass:rgba(16,20,31,0.82);
  --line:rgba(255,255,255,0.075); --line-strong:rgba(255,255,255,0.14);
  --highlight:rgba(255,255,255,0.045);
  --fg:#f1f5fb; --fg2:#a3aec4; --dim:#6c7891;
  --acc:#6366f1; --acc2:#8b5cf6; --acc-hover:#818cf8; --acc-soft:rgba(99,102,241,0.14); --acc-glow:rgba(99,102,241,0.32);
  --ok:#34d399; --ok-soft:rgba(52,211,153,0.13);
  --bad:#f43f5e; --bad-soft:rgba(244,63,94,0.13); --warn:#f59e0b;
  --shadow:0 2px 10px rgba(0,0,0,0.38), 0 1px 2px rgba(0,0,0,0.28);
  --shadow-lg:0 16px 38px rgba(0,0,0,0.56), 0 4px 10px rgba(0,0,0,0.32);
  --ambient:radial-gradient(ellipse 70% 45% at 50% -10%, rgba(99,102,241,0.09), transparent 70%);
}
:root[data-theme="light"] {
  --bg:#f4f6fb; --bg2:#ebeef6; --panel:#ffffff; --panel2:#f3f5fb; --panel-glass:rgba(255,255,255,0.86);
  --line:rgba(15,23,42,0.08); --line-strong:rgba(15,23,42,0.15);
  --highlight:rgba(255,255,255,0.8);
  --fg:#0f172a; --fg2:#475569; --dim:#7d8ca1;
  --acc:#4f46e5; --acc2:#7c3aed; --acc-hover:#4338ca; --acc-soft:rgba(79,70,229,0.085); --acc-glow:rgba(79,70,229,0.2);
  --ok:#059669; --ok-soft:rgba(5,150,105,0.1);
  --bad:#e11d48; --bad-soft:rgba(225,29,72,0.085); --warn:#d97706;
  --shadow:0 1px 3px rgba(15,23,42,0.05), 0 4px 14px rgba(15,23,42,0.035);
  --shadow-lg:0 14px 34px rgba(15,23,42,0.1), 0 3px 8px rgba(15,23,42,0.05);
  --ambient:radial-gradient(ellipse 70% 45% at 50% -10%, rgba(79,70,229,0.06), transparent 70%);
}
* { box-sizing:border-box; margin:0; }
/* 滚动条：极简细条，悬停微显 */
* { scrollbar-width:thin; scrollbar-color:var(--line-strong) transparent; }
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--line-strong); border-radius:999px; }
::-webkit-scrollbar-thumb:hover { background:var(--dim); }
::-webkit-scrollbar-corner { background:transparent; }
html, body { height:100%; }
body {
  background:var(--bg);
  color:var(--fg);
  font:14px/1.6 "Inter","PingFang SC","Microsoft YaHei UI","Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  display:flex; flex-direction:column;
  transition:background-color .25s var(--ease-out), color .25s var(--ease-out);
}
code {
  background:var(--panel2); border:1px solid var(--line); border-radius:5px;
  padding:1px 6px; font-size:0.88em; color:var(--fg);
  font-family:"JetBrains Mono","Fira Code","Cascadia Code",Consolas,monospace;
}

/* ── 顶栏 ── */
header {
  height:56px;
  background:var(--panel-glass);
  backdrop-filter:blur(16px) saturate(1.4);
  -webkit-backdrop-filter:blur(16px) saturate(1.4);
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; padding:0 22px; gap:12px; flex-shrink:0;
  z-index:20;
  box-shadow:0 1px 0 var(--highlight) inset;
}
header .logo {
  width:31px; height:31px; border-radius:10px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-weight:700; font-size:14px;
  box-shadow:0 4px 14px var(--acc-glow), inset 0 1px 0 rgba(255,255,255,0.28);
  letter-spacing:-.02em;
}
header h1 { font-size:15.5px; font-weight:650; letter-spacing:-.02em; }
header .h-badge {
  font-size:11px; font-weight:600; padding:2px 9px; border-radius:999px;
  background:var(--acc-soft); color:var(--acc); letter-spacing:.03em;
  border:1px solid rgba(99,102,241,0.18);
}
header .spacer { flex:1; }
.hbtn {
  background:var(--panel2); border:1px solid var(--line); color:var(--fg2);
  border-radius:999px; padding:6px 14px; cursor:pointer; font:inherit; font-size:12.5px; font-weight:500;
  display:inline-flex; align-items:center; gap:6px;
  transition:all .18s var(--ease-out);
}
.hbtn svg { width:14px; height:14px; flex-shrink:0; }
.hbtn:hover { border-color:var(--acc); color:var(--acc); background:var(--acc-soft); transform:translateY(-1px); }
.hbtn:active { transform:scale(0.97); }

/* ── 布局：侧栏 + 主区 ── */
.wrap { flex:1; display:flex; min-height:0; }
nav {
  width:220px; background:var(--panel); border-right:1px solid var(--line);
  padding:14px 10px; flex-shrink:0; display:flex; flex-direction:column; gap:3px;
  overflow-y:auto;
}
nav .nav-sec {
  font-size:10.5px; font-weight:650; color:var(--dim);
  padding:15px 12px 5px; letter-spacing:.08em; text-transform:uppercase;
}
nav .nav-sec:first-child { padding-top:4px; }
nav button {
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:9px 12px; background:none; border:1px solid transparent; border-radius:10px;
  color:var(--fg2); cursor:pointer; font:inherit; font-size:13.5px; font-weight:500;
  position:relative;
  transition:background-color .16s var(--ease-out), color .16s var(--ease-out), transform .16s var(--ease-out), border-color .16s var(--ease-out);
}
nav button:hover { background:var(--panel2); color:var(--fg); }
nav button:active { transform:scale(0.985); }
nav button.on {
  background:linear-gradient(90deg, var(--acc-soft), transparent 120%);
  color:var(--acc); font-weight:600;
  border-color:rgba(99,102,241,0.22);
}
nav button.on::before {
  content:''; position:absolute; left:0; top:22%; bottom:22%; width:3px;
  border-radius:0 3px 3px 0; background:linear-gradient(180deg, var(--acc), var(--acc2));
  box-shadow:0 0 8px var(--acc-glow);
}
nav button .ic { width:17px; height:17px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; opacity:.82; transition:opacity .16s, transform .16s; }
nav button:hover .ic, nav button.on .ic { opacity:1; }
nav button.on .ic { transform:scale(1.06); }
nav button .ic svg { width:16px; height:16px; }

main { flex:1; overflow-y:auto; padding:26px 34px; min-width:0; scroll-behavior:smooth; background-image:var(--ambient); background-repeat:no-repeat; }
main .inner { max-width:1140px; margin:0 auto; }
@keyframes viewIn {
  from { opacity:0; transform:translateY(6px); }
  to { opacity:1; transform:translateY(0); }
}
.view-enter { animation:viewIn .24s var(--ease-out); }

h2.vtitle { font-size:21px; font-weight:700; letter-spacing:-.025em; margin-bottom:4px; }
.vsub { color:var(--dim); font-size:13.5px; margin-bottom:24px; }
h3.sect { font-size:14px; font-weight:650; margin:24px 0 12px; color:var(--fg); letter-spacing:-.01em; display:flex; align-items:center; gap:8px; }

.card {
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md);
  padding:18px 20px; margin-bottom:14px;
  box-shadow:var(--shadow), inset 0 1px 0 var(--highlight);
  transition:border-color .2s var(--ease-out), box-shadow .2s var(--ease-out);
}
.card:hover { border-color:var(--line-strong); }
.card .t { font-weight:650; font-size:14.5px; display:flex; align-items:center; gap:8px; letter-spacing:-.01em; }
.card .d { color:var(--fg2); font-size:13px; margin-top:4px; line-height:1.65; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:780px) { .grid2 { grid-template-columns:1fr; } }

.tag { display:inline-flex; align-items:center; background:var(--panel2); color:var(--fg2); border:1px solid var(--line); border-radius:6px; padding:1px 8px; font-size:11px; font-weight:500; line-height:1.7; font-variant-numeric:tabular-nums; }
.tag.acc { background:var(--acc-soft); color:var(--acc); border-color:rgba(99,102,241,0.18); }
.tag.ok { background:var(--ok-soft); color:var(--ok); border-color:rgba(52,211,153,0.18); }
.tag.bad { background:var(--bad-soft); color:var(--bad); border-color:rgba(244,63,94,0.18); }
.tag.warn { background:rgba(245,158,11,.12); color:var(--warn); border-color:rgba(245,158,11,0.2); }

.row { display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; align-items:center; }
label.f { display:block; font-size:12px; font-weight:500; color:var(--dim); margin:11px 0 5px; }
input,textarea,select {
  background:var(--bg2); border:1px solid var(--line); color:var(--fg);
  border-radius:var(--radius-sm); padding:8.5px 12px; font:inherit; font-size:13.5px; outline:none;
  transition:border-color .18s var(--ease-out), box-shadow .18s var(--ease-out), background-color .18s;
}
/* 分块参数输入框：透明背景 */
.param-input { width:110px; background:transparent; }
.param-input:hover { border-color:var(--fg2); }
.param-input:focus { border-color:var(--acc); background:transparent; }
/* 数字调节箭头：背景透明，保留浏览器原生可点击的上下调节 */
.param-input { color-scheme: light dark; }
.param-input::-webkit-inner-spin-button,
.param-input::-webkit-outer-spin-button {
  background: transparent;
  opacity: 0.55;
  cursor: pointer;
}
.param-input::-webkit-inner-spin-button:hover,
.param-input::-webkit-outer-spin-button:hover { opacity: 1; }
input:hover,textarea:hover,select:hover { border-color:var(--line-strong); }
input:focus,textarea:focus,select:focus { border-color:var(--acc); box-shadow:0 0 0 3px var(--acc-soft); }
textarea { width:100%; min-height:78px; resize:vertical; line-height:1.55; }

button.act {
  background:linear-gradient(135deg,var(--acc),var(--acc2)); border:none; color:#fff;
  border-radius:var(--radius-sm); padding:8.5px 16px; cursor:pointer; font:inherit; font-size:13.5px; font-weight:500;
  box-shadow:0 2px 10px var(--acc-glow), inset 0 1px 0 rgba(255,255,255,0.22);
  transition:all .18s var(--ease-out);
}
button.act:hover { filter:brightness(1.08); transform:translateY(-1px); box-shadow:0 5px 16px var(--acc-glow), inset 0 1px 0 rgba(255,255,255,0.28); }
button.act:active { transform:translateY(0) scale(0.98); }
button.act:disabled { opacity:.45; cursor:not-allowed; transform:none; box-shadow:none; }

button.ghost {
  background:transparent; border:1px solid var(--line); color:var(--fg2);
  border-radius:var(--radius-sm); padding:7.5px 14px; cursor:pointer; font:inherit; font-size:13px; font-weight:500;
  transition:all .18s var(--ease-out);
}
button.ghost:hover { border-color:var(--acc); color:var(--acc); background:var(--acc-soft); }
button.ghost:active { transform:scale(0.98); }

button.danger {
  background:var(--bad-soft); color:var(--bad); border:1px solid transparent;
  border-radius:var(--radius-sm); padding:7.5px 14px; cursor:pointer; font:inherit; font-size:13px; font-weight:500;
  transition:all .18s var(--ease-out);
}
button.danger:hover { border-color:var(--bad); background:rgba(244,63,94,0.2); }
button.danger:active { transform:scale(0.98); }

pre {
  background:var(--bg2); border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:12px 14px; overflow:auto; font-size:12px; line-height:1.6; white-space:pre-wrap; max-height:340px; color:var(--fg2);
  font-family:"JetBrains Mono","Fira Code","Cascadia Code",Consolas,monospace;
}
table { width:100%; border-collapse:separate; border-spacing:0; font-size:13px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden; box-shadow:var(--shadow); }
th,td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
tr:last-child td { border-bottom:none; }
tbody tr { transition:background-color .15s; }
tbody tr:hover td { background:var(--acc-soft); }
th { color:var(--dim); font-weight:600; font-size:11.5px; letter-spacing:.04em; background:var(--panel2); text-transform:uppercase; }
.empty { text-align:center; color:var(--dim); padding:44px 16px; font-size:13px; border:1px dashed var(--line-strong); border-radius:var(--radius-md); background:var(--panel); }
.msg { padding:10px 14px; border-radius:var(--radius-sm); font-size:13px; margin:8px 0; animation:viewIn .2s var(--ease-out); }
.msg.ok { background:var(--ok-soft); color:var(--ok); border:1px solid rgba(52,211,153,0.2); }
.msg.bad { background:var(--bad-soft); color:var(--bad); border:1px solid rgba(244,63,94,0.2); }
.hidden { display:none !important; }

/* ── 自定义弹框（替代浏览器 alert/confirm/prompt）── */
.modal-mask {
  position:fixed; inset:0; background:rgba(0,0,0,.55);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  display:flex; align-items:center; justify-content:center; z-index:9999;
  animation:fadeIn .16s var(--ease-out);
}
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes modalIn {
  from { opacity:0; transform:scale(0.95) translateY(8px); }
  to { opacity:1; transform:scale(1) translateY(0); }
}
.modal {
  background:var(--panel); border:1px solid var(--line-strong); border-radius:var(--radius-lg);
  padding:22px 24px; width:380px; max-width:90vw; box-shadow:var(--shadow-lg);
  animation:modalIn .22s var(--ease-out);
}
.modal .mt { font-size:16px; font-weight:650; margin-bottom:10px; letter-spacing:-.01em; }
.modal .md { font-size:13.5px; color:var(--fg2); line-height:1.65; margin-bottom:16px; }
.modal input { width:100%; }
.modal .mb { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
.spin { display:inline-block; width:14px; height:14px; border:2px solid var(--line-strong); border-top-color:var(--acc); border-radius:50%; animation:sp .7s linear infinite; vertical-align:-2px; }
@keyframes sp { to { transform:rotate(360deg); } }

/* ── 聊天式 Skill 创作 & Playground ── */
.chat-shell { display:flex; flex-direction:column; height:560px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow); }
.pg-page { display:flex; flex-direction:column; height:calc(100vh - 96px); }
.pg-title { flex-shrink:0; margin-bottom:12px; }
.pg-shell { flex:1; height:auto; min-height:0; }
.pg-trace-wrap { flex-shrink:0; max-height:170px; overflow-y:auto; padding:0 16px 8px; }
.pg-trace-wrap .sect { margin:8px 0 6px; }
.pg-trace-wrap table { font-size:11.5px; }
.chat-head { padding:13px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; background:var(--panel2); position:relative; z-index:30; }
.chat-head .dot { width:9px; height:9px; border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok); flex-shrink:0; }
.chat-head .who { font-weight:650; font-size:13.5px; }
.chat-head .pg-head-desc { font-size:12px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:340px; }
.chat-head .st { margin-left:auto; position:relative; }
/* ── Playground 自定义 Agent 选择器 ── */
.sr-select { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; margin:0; padding:0; }
.pg-picker { position:relative; }
.pg-picker-btn {
  display:inline-flex; align-items:center; gap:9px;
  min-width:230px; max-width:340px;
  padding:6px 11px 6px 8px;
  background:var(--panel); border:1px solid var(--line-strong); border-radius:11px;
  color:var(--fg); cursor:pointer; font:inherit; text-align:left;
  box-shadow:var(--shadow), inset 0 1px 0 var(--highlight);
  transition:border-color .18s var(--ease-out), box-shadow .18s var(--ease-out), background-color .18s, transform .15s;
}
.pg-picker-btn:hover { border-color:var(--acc); background:var(--panel); }
.pg-picker.open .pg-picker-btn { border-color:var(--acc); box-shadow:0 0 0 3px var(--acc-soft), var(--shadow); }
.pg-picker-btn .pg-ic {
  width:26px; height:26px; border-radius:8px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--acc-soft); color:var(--acc);
  border:1px solid rgba(99,102,241,0.22);
}
.pg-picker-btn .pg-ic svg { width:14px; height:14px; }
.pg-picker-btn .pg-lbl { flex:1; min-width:0; display:flex; align-items:center; gap:7px; }
.pg-picker-btn .pg-name { font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pg-picker-btn .pg-ver {
  font-size:10.5px; font-weight:600; padding:1px 6px; border-radius:999px;
  background:var(--acc-soft); color:var(--acc); flex-shrink:0; font-variant-numeric:tabular-nums;
}
.pg-picker-btn .pg-chev { width:15px; height:15px; color:var(--dim); flex-shrink:0; transition:transform .2s var(--ease-out), color .18s; }
.pg-picker.open .pg-picker-btn .pg-chev { transform:rotate(180deg); color:var(--acc); }
.pg-picker-pop {
  position:absolute; top:calc(100% + 8px); right:0; width:348px; max-width:88vw;
  background:var(--panel); border:1px solid var(--line-strong); border-radius:14px;
  box-shadow:var(--shadow-lg); z-index:60; overflow:hidden;
  display:none; flex-direction:column;
  animation:modalIn .18s var(--ease-out);
}
.pg-picker.open .pg-picker-pop { display:flex; }
.pg-picker-search {
  display:flex; align-items:center; gap:8px; padding:10px 12px;
  border-bottom:1px solid var(--line); background:var(--panel2);
}
.pg-picker-search svg { width:14px; height:14px; color:var(--dim); flex-shrink:0; }
.pg-picker-search input {
  flex:1; background:none; border:none; box-shadow:none; padding:2px 0;
  font-size:12.5px; color:var(--fg); outline:none;
}
.pg-picker-search input:focus { box-shadow:none; }
.pg-picker-list { max-height:290px; overflow-y:auto; padding:6px; display:flex; flex-direction:column; gap:3px; }
.pg-picker-opt {
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:9px 10px; border-radius:10px; border:1px solid transparent;
  background:transparent; color:var(--fg); cursor:pointer; font:inherit;
  transition:background-color .15s var(--ease-out), border-color .15s;
}
.pg-picker-opt:hover { background:var(--panel2); border-color:var(--line); }
.pg-picker-opt.on { background:var(--acc-soft); border-color:rgba(99,102,241,0.28); }
.pg-picker-opt .po-ic {
  width:30px; height:30px; border-radius:8px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--panel2); border:1px solid var(--line); color:var(--fg2);
}
.pg-picker-opt.on .po-ic { background:var(--acc); border-color:var(--acc); color:#fff; box-shadow:0 2px 8px var(--acc-glow); }
.pg-picker-opt .po-ic svg { width:15px; height:15px; }
.pg-picker-opt .po-body { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
.pg-picker-opt .po-top { display:flex; align-items:center; gap:6px; }
.pg-picker-opt .po-name { font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pg-picker-opt.on .po-name { color:var(--acc); }
.pg-picker-opt .po-desc { font-size:11.5px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pg-picker-opt .po-meta { display:flex; gap:5px; align-items:center; flex-wrap:wrap; margin-top:1px; }
.pg-picker-opt .po-chip { font-size:10px; padding:1px 6px; border-radius:5px; background:var(--panel2); border:1px solid var(--line); color:var(--fg2); }
.pg-picker-opt .po-chk { width:16px; height:16px; color:var(--acc); flex-shrink:0; opacity:0; }
.pg-picker-opt.on .po-chk { opacity:1; }
.pg-picker-foot {
  padding:7px 12px; border-top:1px solid var(--line); background:var(--panel2);
  font-size:11px; color:var(--dim); display:flex; align-items:center; justify-content:space-between;
}
.pg-picker-empty { padding:22px 12px; text-align:center; font-size:12.5px; color:var(--dim); }

/* ── 通用自定义下拉菜单（知识库体裁 / A2A 调用链等全站统一） ── */
.ui-sel { position:relative; width:100%; }
.ui-sel-btn {
  display:flex; align-items:center; gap:9px; width:100%;
  padding:8px 12px 8px 10px;
  background:var(--bg2); border:1px solid var(--line); border-radius:10px;
  color:var(--fg); cursor:pointer; font:inherit; font-size:13.5px; text-align:left;
  box-shadow:inset 0 1px 0 var(--highlight);
  transition:border-color .18s var(--ease-out), box-shadow .18s var(--ease-out), background-color .18s;
}
.ui-sel-btn:hover { border-color:var(--line-strong); background:var(--panel2); }
.ui-sel.open .ui-sel-btn { border-color:var(--acc); box-shadow:0 0 0 3px var(--acc-soft); background:var(--panel); }
.ui-sel-ic {
  width:24px; height:24px; border-radius:7px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--acc-soft); color:var(--acc);
  border:1px solid rgba(99,102,241,0.2);
}
.ui-sel-ic svg { width:13px; height:13px; }
.ui-sel-val { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; }
.ui-sel-val.placeholder { color:var(--fg2); font-weight:400; }
.ui-sel-chev { width:15px; height:15px; color:var(--dim); flex-shrink:0; transition:transform .2s var(--ease-out), color .18s; }
.ui-sel.open .ui-sel-chev { transform:rotate(180deg); color:var(--acc); }
.ui-sel-pop {
  position:absolute; top:calc(100% + 6px); left:0; right:0; min-width:240px;
  background:var(--panel); border:1px solid var(--line-strong); border-radius:13px;
  box-shadow:var(--shadow-lg); z-index:70; overflow:hidden;
  display:none; flex-direction:column;
  animation:modalIn .16s var(--ease-out);
}
.ui-sel.open .ui-sel-pop { display:flex; }
.ui-sel-search {
  display:flex; align-items:center; gap:7px; padding:8px 11px;
  border-bottom:1px solid var(--line); background:var(--panel2);
}
.ui-sel-search svg { width:13px; height:13px; color:var(--dim); flex-shrink:0; }
.ui-sel-search input {
  flex:1; background:none; border:none; box-shadow:none; padding:2px 0;
  font-size:12.5px; color:var(--fg); outline:none;
}
.ui-sel-search input:focus { box-shadow:none; }
.ui-sel-list { max-height:256px; overflow-y:auto; padding:5px; display:flex; flex-direction:column; gap:2px; }
.ui-sel-opt {
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:8px 10px; border-radius:8px; border:1px solid transparent;
  background:transparent; color:var(--fg2); cursor:pointer; font:inherit; font-size:13px;
  transition:background-color .14s var(--ease-out), color .14s, border-color .14s;
}
.ui-sel-opt:hover { background:var(--panel2); color:var(--fg); }
.ui-sel-opt.on { background:var(--acc-soft); color:var(--acc); font-weight:600; border-color:rgba(99,102,241,0.22); }
.ui-sel-opt .uso-txt { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ui-sel-opt .uso-tag { font-size:10.5px; padding:1px 6px; border-radius:5px; background:var(--panel2); border:1px solid var(--line); color:var(--dim); flex-shrink:0; }
.ui-sel-opt.on .uso-tag { background:var(--panel); border-color:rgba(99,102,241,0.25); color:var(--acc); }
.ui-sel-opt .uso-chk { width:14px; height:14px; color:var(--acc); flex-shrink:0; opacity:0; }
.ui-sel-opt.on .uso-chk { opacity:1; }
.ui-sel-empty { padding:18px 10px; text-align:center; font-size:12px; color:var(--dim); }
.chat-body { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; background:var(--bg2); scroll-behavior:smooth; }
.bubble { max-width:78%; padding:10px 15px; border-radius:14px; font-size:13.5px; line-height:1.65; white-space:pre-wrap; word-break:break-word; animation:msgIn .2s var(--ease-out); }
@keyframes msgIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
.bubble.ai { align-self:flex-start; background:var(--panel); border:1px solid var(--line); border-top-left-radius:4px; box-shadow:var(--shadow); }
.bubble.me { align-self:flex-end; background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#fff; border-top-right-radius:4px; box-shadow:0 3px 12px var(--acc-glow); }
.draft-card { align-self:flex-start; max-width:86%; background:var(--panel); border:1px solid var(--acc); border-radius:14px; border-top-left-radius:4px; padding:14px 16px; font-size:13px; box-shadow:var(--shadow); }
.draft-card .dt { font-weight:650; color:var(--acc); margin-bottom:8px; font-size:13px; }
.draft-card .kv { margin:3px 0; }
.draft-card .kv b { color:var(--dim); font-weight:500; font-size:12px; margin-right:6px; }
.chat-input { display:flex; gap:10px; padding:14px 16px; border-top:1px solid var(--line); background:var(--panel); }
.chat-input textarea { flex:1; min-height:44px; max-height:120px; }
.chat-actions { display:flex; gap:8px; align-items:flex-end; }

.badge-state { font-size:11px; padding:2px 10px; border-radius:20px; font-weight:500; }
.badge-state.clarify { background:var(--acc-soft); color:var(--acc); }
.badge-state.draft { background:rgba(245,158,11,.12); color:var(--warn); }
.badge-state.submitted { background:var(--ok-soft); color:var(--ok); }

/* ── 智能对话：会话列表 + 聊天区 ── */
.chat-layout { display:flex; gap:0; height:calc(100vh - 96px); border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-lg); border:1px solid var(--line); background:var(--panel); }
.sess-side { width:260px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden; }
.sess-head { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; background:var(--panel); }
.sess-head .t { font-size:13.5px; font-weight:650; flex:1; letter-spacing:-.01em; }
.sess-new {
  width:30px; height:30px; border-radius:9px; border:1px solid var(--line);
  background:var(--panel2); color:var(--fg2); cursor:pointer; font-size:16px;
  display:flex; align-items:center; justify-content:center;
  transition:all .18s var(--ease-out);
}
.sess-new:hover { border-color:var(--acc); color:var(--acc); background:var(--acc-soft); transform:scale(1.06); }
.sess-new:active { transform:scale(0.95); }
.sess-list { flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:2px; }
.sess-item {
  padding:9px 11px; border-radius:10px; cursor:pointer;
  display:flex; align-items:center; gap:8px; border:1px solid transparent;
  transition:background-color .16s var(--ease-out), color .16s, border-color .16s;
}
.sess-item:hover { background:var(--panel2); }
.sess-item.on { background:var(--acc-soft); border-color:rgba(99,102,241,0.2); }
.sess-item .st { flex:1; min-width:0; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--fg2); }
.sess-item.on .st { color:var(--acc); font-weight:600; }
.sess-item .del { opacity:0; border:none; background:none; color:var(--dim); cursor:pointer; font-size:11px; padding:2px 6px; border-radius:5px; transition:opacity .15s, background-color .15s, color .15s; }
.sess-item:hover .del { opacity:1; }
.sess-item .del:hover { color:var(--bad); background:var(--bad-soft); }

/* 轻量提示浮层 */
#quick-toast { position:fixed; top:18px; right:22px; z-index:9999; pointer-events:none; }
.qt-item {
  padding:11px 16px; border-radius:11px; font-size:13px; font-weight:500;
  background:var(--panel-glass); border:1px solid var(--line-strong); box-shadow:var(--shadow-lg);
  max-width:420px; animation:qtIn .22s var(--ease-out);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
}
.qt-item.ok { border-left:3px solid var(--ok); }
.qt-item.bad { border-left:3px solid var(--bad); }
@keyframes qtIn { from { opacity:0; transform:translateY(-10px) scale(0.97); } to { opacity:1; transform:translateY(0) scale(1); } }

/* 会话任务状态：转圈=执行中，绿点=已完成 */
.sess-done { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok); flex-shrink:0; }
.sess-status-empty { display:inline-block; width:8px; height:8px; flex-shrink:0; }
.chat-main { flex:1; min-width:0; display:flex; flex-direction:column; background:var(--bg); overflow:hidden; position:relative; }
.chat-page { display:flex; flex-direction:column; height:100%; width:100%; max-width:none; margin:0; padding:0 24px; }
.chat-scroll { flex:1; overflow-y:auto; padding:26px 8px 14px; scroll-behavior:smooth; }
.chat-scroll > .turn, .chat-scroll > .welcome { max-width:860px; margin-left:auto; margin-right:auto; }
.welcome { text-align:center; padding:11vh 20px 24px; position:relative; animation:viewIn .3s var(--ease-out); }
.welcome::before {
  content:''; position:absolute; left:50%; top:14%; transform:translateX(-50%);
  width:380px; height:160px; border-radius:50%;
  background:radial-gradient(circle, var(--acc-glow) 0%, transparent 70%);
  filter:blur(44px); pointer-events:none; z-index:0; opacity:.6;
}
.welcome > * { position:relative; z-index:1; }
.welcome .w-emblem {
  width:52px; height:52px; border-radius:16px; margin:0 auto 18px;
  background:linear-gradient(135deg, var(--acc), var(--acc2));
  color:#fff; display:flex; align-items:center; justify-content:center;
  box-shadow:0 8px 24px var(--acc-glow), inset 0 1px 0 rgba(255,255,255,0.3);
}
.welcome .w-emblem svg { width:26px; height:26px; }
.welcome .big { font-size:27px; font-weight:750; letter-spacing:-.03em; background:linear-gradient(135deg,var(--fg) 25%,var(--acc)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.welcome .sub { color:var(--dim); margin:10px 0 30px; font-size:13.5px; }
.welcome .sugg { display:grid; grid-template-columns:1fr 1fr; gap:12px; max-width:660px; margin:0 auto; text-align:left; }
.welcome .sugg button {
  background:var(--panel); border:1px solid var(--line); border-radius:14px;
  padding:14px 16px; cursor:pointer; font:inherit; font-size:13px; color:var(--fg2);
  text-align:left; box-shadow:var(--shadow), inset 0 1px 0 var(--highlight);
  display:flex; align-items:center; gap:10px;
  transition:all .2s var(--ease-out);
}
.welcome .sugg button::before {
  content:'✦'; font-size:12px; color:var(--acc); opacity:.75; flex-shrink:0;
  transition:transform .2s var(--ease-out), opacity .2s;
}
.welcome .sugg button:hover { border-color:var(--acc); color:var(--fg); transform:translateY(-2px); box-shadow:var(--shadow-lg); background:var(--panel2); }
.welcome .sugg button:hover::before { opacity:1; transform:scale(1.15); }
.welcome .sugg button:active { transform:translateY(0) scale(0.99); }

/* 用户消息：右对齐气泡 */
.turn.user { display:flex; justify-content:flex-end; margin:18px 0; animation:msgIn .2s var(--ease-out); }
.turn.user .bubble {
  background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#fff;
  border-radius:18px 18px 5px 18px; padding:11px 17px; max-width:76%;
  font-size:14px; line-height:1.65; white-space:pre-wrap; word-break:break-word;
  box-shadow:0 4px 16px var(--acc-glow), inset 0 1px 0 rgba(255,255,255,0.22);
}

/* AI 回答：左侧正文流，无气泡 */
.turn.ai { margin:22px 0; animation:msgIn .22s var(--ease-out); }
.turn.ai .content { font-size:14.5px; line-height:1.82; white-space:pre-wrap; word-break:break-word; color:var(--fg); }
.turn.ai .content p { margin: 0 0 .6em; }

/* 思考：精致可折叠玻璃卡，点击展开 */
.think { margin:4px 0 14px; background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; transition:border-color .2s var(--ease-out); }
.think:hover { border-color:var(--line-strong); }
.think.live { border-color:rgba(99,102,241,0.32); }
.think > summary { cursor:pointer; color:var(--fg2); font-size:12.5px; font-weight:500; user-select:none; list-style:none; display:flex; align-items:center; gap:8px; padding:9px 14px; transition:color .15s, background-color .15s; }
.think > summary::-webkit-details-marker { display:none; }
.think > summary .line { flex:1; height:1px; background:var(--line); opacity:.6; }
.think > summary:hover { color:var(--fg); background:var(--panel2); }
.think > summary .caret { transition:transform .2s var(--ease-out); display:inline-block; font-size:10px; color:var(--dim); }
.think[open] > summary .caret { transform:rotate(90deg); color:var(--acc); }
.think[open] > summary { color:var(--fg); border-bottom:1px solid var(--line); }
.think .think-body { padding:11px 14px; font-size:12.5px; line-height:1.72; color:var(--dim); white-space:pre-wrap; background:var(--bg2); }
.think.live > summary .label { color:var(--acc); display:inline-flex; align-items:center; gap:6px; }
.think.live > summary .label::before {
  content:''; width:7px; height:7px; border-radius:50%; background:var(--acc);
  box-shadow:0 0 8px var(--acc); animation:pulseDot 1.4s ease-in-out infinite;
}
@keyframes pulseDot { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.45; transform:scale(0.8); } }

/* 子 Agent 实时过程区块 */
.sub-process {
  margin:4px 0 12px; padding:10px 14px;
  border:1px solid var(--line); border-left:3px solid var(--acc);
  background:var(--panel); border-radius:10px;
  display:flex; flex-direction:column; gap:6px;
  box-shadow:var(--shadow);
}
.sub-process .sub-row { font-size:12.5px; line-height:1.6; color:var(--fg2); display:flex; align-items:flex-start; gap:8px; word-break:break-word; }
.sub-process .sub-tag {
  display:inline-flex; align-items:center; flex-shrink:0;
  padding:1px 8px; border-radius:999px;
  background:var(--acc-soft); color:var(--acc); border:1px solid rgba(99,102,241,0.25);
  font-size:11px; font-weight:600; margin-top:1px;
}

/* 委托轨迹：精致胶囊标签 */
.deli {
  margin:4px 0 12px; font-size:12px; color:var(--fg2);
  display:inline-flex; align-items:center; gap:7px; flex-wrap:wrap;
  background:var(--panel); border:1px solid rgba(99,102,241,0.25);
  padding:5px 12px; border-radius:999px; box-shadow:var(--shadow);
}
.deli::before {
  content:''; width:6px; height:6px; border-radius:50%;
  background:linear-gradient(135deg, var(--acc), var(--acc2));
  box-shadow:0 0 8px var(--acc-glow); flex-shrink:0;
}
.deli b { color:var(--acc); font-weight:600; }

/* ── 对话面板：Agent 生成文件卡片（精致附件托盘） ── */
.deliver-files-wrap {
  margin-top:16px;
  padding:12px 14px 14px;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:14px;
  white-space:normal;
  box-shadow:inset 0 1px 0 var(--highlight);
  animation:msgIn .24s var(--ease-out);
}
.deliver-files-head {
  display:flex; align-items:center; gap:7px;
  margin-bottom:10px;
  font-size:12px; font-weight:600; color:var(--fg2);
  letter-spacing:.01em;
}
.deliver-files-head svg { width:14px; height:14px; color:var(--acc); flex-shrink:0; }
.deliver-files-head .df-count {
  margin-left:auto; font-size:11px; font-weight:500; color:var(--dim);
  background:var(--panel); border:1px solid var(--line);
  padding:1px 8px; border-radius:999px; font-variant-numeric:tabular-nums;
}
.deliver-files {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(248px, 1fr));
  gap:10px;
}
.deliver-file {
  --df-c: var(--acc);
  --df-bg: var(--acc-soft);
  position:relative;
  display:flex; align-items:center; gap:12px;
  padding:11px 13px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  color:var(--fg); text-decoration:none;
  overflow:hidden;
  box-shadow:var(--shadow), inset 0 1px 0 var(--highlight);
  transition:transform .2s var(--ease-out), border-color .2s var(--ease-out), box-shadow .2s var(--ease-out), background-color .2s;
}
.deliver-file::before {
  content:''; position:absolute; inset:0 0 auto 0; height:2px;
  background:linear-gradient(90deg, var(--df-c), transparent 85%);
  opacity:0; transition:opacity .22s var(--ease-out);
}
.deliver-file:hover {
  transform:translateY(-2px);
  border-color:var(--df-c);
  box-shadow:var(--shadow-lg), 0 0 0 1px color-mix(in srgb, var(--df-c) 24%, transparent);
}
.deliver-file:hover::before { opacity:1; }
.deliver-file:active { transform:translateY(0) scale(0.99); }
.deliver-file .df-icon {
  width:40px; height:40px; border-radius:10px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--df-bg); color:var(--df-c);
  border:1px solid color-mix(in srgb, var(--df-c) 24%, transparent);
  transition:transform .22s var(--ease-spring), background-color .2s;
}
.deliver-file:hover .df-icon { transform:scale(1.06); }
.deliver-file .df-icon svg { width:20px; height:20px; }
.deliver-file .df-info { flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
.deliver-file .df-name {
  font-size:13px; font-weight:600; color:var(--fg);
  line-height:1.35; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.deliver-file .df-meta {
  display:flex; align-items:center; gap:7px;
  font-size:11px; color:var(--dim); line-height:1; font-variant-numeric:tabular-nums;
}
.deliver-file .df-ext {
  display:inline-flex; align-items:center;
  padding:2px 6px; border-radius:5px;
  font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
  background:var(--df-bg); color:var(--df-c);
}
.deliver-file .df-dl {
  width:30px; height:30px; border-radius:8px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--panel2); border:1px solid var(--line); color:var(--fg2);
  transition:all .2s var(--ease-out);
}
.deliver-file .df-dl svg { width:15px; height:15px; transition:transform .2s var(--ease-out); }
.deliver-file:hover .df-dl {
  background:var(--df-c); border-color:var(--df-c); color:#fff;
  box-shadow:0 3px 10px color-mix(in srgb, var(--df-c) 38%, transparent);
}
.deliver-file:hover .df-dl svg { transform:translateY(1px); }
/* 文件类型色板 */
.deliver-file.df-word { --df-c:#3b82f6; --df-bg:rgba(59,130,246,0.13); }
.deliver-file.df-excel { --df-c:#10b981; --df-bg:rgba(16,185,129,0.13); }
.deliver-file.df-pdf { --df-c:#f43f5e; --df-bg:rgba(244,63,94,0.13); }
.deliver-file.df-json { --df-c:#f59e0b; --df-bg:rgba(245,158,11,0.13); }
.deliver-file.df-text { --df-c:#8b5cf6; --df-bg:rgba(139,92,246,0.13); }
.deliver-file.df-image { --df-c:#06b6d4; --df-bg:rgba(6,182,212,0.13); }
.deliver-file.df-code { --df-c:#0ea5e9; --df-bg:rgba(14,165,233,0.13); }
.deliver-file.df-zip { --df-c:#f97316; --df-bg:rgba(249,115,22,0.13); }

/* 流式光标 */
.cursor { display:inline-block; width:7px; height:15px; background:var(--acc); vertical-align:-2px; margin-left:3px; animation:blink 1s steps(1) infinite; border-radius:2px; }
@keyframes blink { 50% { opacity:0; } }

/* 底部输入区：居中悬浮 */
.composer-wrap { flex-shrink:0; padding:10px 0 12px; width:100%; max-width:860px; margin:0 auto; }
.composer {
  background:var(--panel); border:1px solid var(--line-strong); border-radius:18px;
  padding:10px 12px 10px 16px; display:flex; gap:10px; align-items:flex-end;
  box-shadow:var(--shadow), inset 0 1px 0 var(--highlight);
  transition:border-color .18s var(--ease-out), box-shadow .18s var(--ease-out);
}
.composer:focus-within { border-color:var(--acc); box-shadow:0 0 0 3px var(--acc-soft), var(--shadow-lg); }
.composer textarea { flex:1; background:none; border:none; box-shadow:none; color:var(--fg); resize:none; min-height:24px; max-height:160px; padding:4px 2px; font-size:14.5px; outline:none; font-family:inherit; }
.composer textarea:focus { box-shadow:none; }
.composer .send {
  height:36px; border-radius:11px; border:none;
  background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#fff;
  cursor:pointer; font-size:13px; font-weight:500;
  display:flex; align-items:center; justify-content:center; gap:5px; flex-shrink:0;
  box-shadow:0 2px 10px var(--acc-glow), inset 0 1px 0 rgba(255,255,255,0.22);
  transition:all .18s var(--ease-out);
}
.composer .send:hover:not(:disabled) { filter:brightness(1.1); transform:translateY(-1px); box-shadow:0 4px 14px var(--acc-glow); }
.composer .send:active:not(:disabled) { transform:scale(0.96); }
.composer .send:disabled { opacity:.35; cursor:not-allowed; box-shadow:none; }
.composer .send.stop { background:var(--bad); box-shadow:0 2px 10px rgba(244,63,94,0.3); }

/* ── 图标按钮 ── */
.icon-btn { width:36px; height:36px; border-radius:50%; border:1px solid var(--line-strong); background:var(--panel2); color:var(--fg2); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .18s var(--ease-out); padding:0; }

@keyframes spin { to { transform: rotate(360deg); } }
.spinner { display:inline-block; width:15px; height:15px; border:2px solid var(--line-strong); border-top-color:var(--acc); border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-right:6px; }

.ft-pdf { background:linear-gradient(135deg,#e11d48,#f43f5e); } .ft-doc { background:linear-gradient(135deg,#2563eb,#3b82f6); } .ft-xls { background:linear-gradient(135deg,#059669,#10b981); }

/* 列表区与表单卡片使用相同外框：左边界/宽度一致，卡片内边距统一 18px */

}

<script>
/* ── 主题切换 ── */
const THEME_ICON = {
  dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>',
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>'
};
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  localStorage.setItem('aws-theme', t);
  const btn = document.getElementById('themeBtn');
  if (btn) btn.innerHTML = `${THEME_ICON[t] || ''}<span>${t === 'dark' ? '深色' : '浅色'}</span>`;
}
function toggleTheme() {
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
}
applyTheme(localStorage.getItem('aws-theme') || 'dark');

const $ = sel => document.querySelector(sel);
const api = (p, opt) => fetch(p, opt).then(async r => {
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof body.detail === 'object' ? `${body.detail.rule}: ${body.detail.message}` : (body.detail || r.statusText));
  return body;
});
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg = (ok, text) => `<div class="msg ${ok?'ok':'bad'}">${esc(text)}</div>`;
const loading = txt => `<span class="spin"></span> <span style="color:var(--dim);font-size:12.5px">${esc(txt||'处理中…')}</span>`;
const page = $('#main');
let chat = { id: null, state: 'clarify', draft: null };

/* 临时提示：5 秒后自动消失，新消息覆盖旧计时 */
const _msgTimers = new WeakMap();
function flashMsg(el, ok, text, timeout = 5000) {
  if (!el) return;
  clearTimeout(_msgTimers.get(el));
  el.innerHTML = msg(ok, text);
  _msgTimers.set(el, setTimeout(() => { el.innerHTML = ''; _msgTimers.delete(el); }, timeout));
}

/* ── 自定义弹框：返回 Promise ── */
function modal({ title, message = '', input = false, defaultValue = '', confirmText = '确定', cancelText = '取消', danger = false, html = '', collect = null }) {
  return new Promise(resolve => {
    const mask = document.createElement('div');
    mask.className = 'modal-mask';
    mask.innerHTML = `<div class="modal" ${html ? 'style="width:560px"' : ''}>
      <div class="mt">${esc(title)}</div>
      ${html ? `<div class="md" style="max-height:70vh;overflow-y:auto">${html}</div>` : (message ? `<div class="md">${esc(message)}</div>` : '')}
      ${input ? `<input id="modal-input" value="${esc(defaultValue)}" placeholder="请输入">` : ''}
      <div class="mb">
        ${cancelText ? `<button class="ghost" id="modal-cancel">${esc(cancelText)}</button>` : ''}
        <button class="act" id="modal-ok" ${danger ? 'style="background:var(--bad)"' : ''}>${esc(confirmText)}</button>
      </div></div>`;
    document.body.appendChild(mask);
    const done = v => { document.removeEventListener('keydown', onEsc); mask.remove(); resolve(v); };
    const onEsc = e => { if (e.key === 'Escape') done(null); };
    document.addEventListener('keydown', onEsc);
    const cancelBtn = mask.querySelector('#modal-cancel');
    if (cancelBtn) cancelBtn.onclick = () => done(null);
    mask.querySelector('#modal-ok').onclick = () => {
      if (collect) {
        const data = {};
        for (const [key, sel] of Object.entries(collect)) {
          const el = mask.querySelector(sel);
          data[key] = el ? el.value : '';
        }
        done(data);
      } else {
        done(input ? mask.querySelector('#modal-input').value.trim() : true);
      }
    };
    mask.onclick = e => { if (e.target === mask) done(null); };
    if (input) { const i = mask.querySelector('#modal-input'); i.focus(); i.select(); i.onkeydown = e => { if (e.key === 'Enter') mask.querySelector('#modal-ok').click(); }; }
  });
}
/* 轻量提示：右上角浮出，自动消失（区别于模态 toast） */
function toastQuick(message, ok = true, ms = 3000) {

  window._qtTimer = setTimeout(() => { box.innerHTML = ''; }, ms);
}

/* ── 通用自定义下拉菜单增强器（保留原生 select 兼容自动化与表单，双向同步） ── */
function enhanceSelect(sel, { icon = '', searchPlaceholder = '搜索选项…', searchable = true } = {}) {
  if (!sel || sel.dataset.uiEnhanced) return;
  sel.dataset.uiEnhanced = '1';

  const chevSvg = '<svg class="ui-sel-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
  const searchSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>';
  const checkSvg = '<svg class="uso-chk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

  const wrap = document.createElement('div');
  wrap.className = 'ui-sel';
  sel.parentNode.insertBefore(wrap, sel);
  sel.classList.add('sr-select');
  wrap.appendChild(sel);

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'ui-sel-btn';
  btn.innerHTML = `<span class="ui-sel-ic">${defIcon}</span><span class="ui-sel-val"></span>${chevSvg}`;
  wrap.appendChild(btn);

  const pop = document.createElement('div');
  pop.className = 'ui-sel-pop';
  pop.innerHTML = `${searchable ? `<div class="ui-sel-search">${searchSvg}<input placeholder="${esc(searchPlaceholder)}" autocomplete="off"></div>` : ''}<div class="ui-sel-list"></div>`;
  wrap.appendChild(pop);

  const valEl = btn.querySelector('.ui-sel-val');
  const qEl = pop.querySelector('.ui-sel-search input');
  const listEl = pop.querySelector('.ui-sel-list');
  const searchWrap = pop.querySelector('.ui-sel-search');

  const syncLabel = () => {
    const opt = sel.options[sel.selectedIndex] || sel.options[0];
    valEl.textContent = opt ? opt.textContent : '请选择';
    valEl.classList.toggle('placeholder', !sel.value);
  };
  const renderList = (kw = '') => {
    const opts = [...sel.options];
    if (searchWrap) searchWrap.style.display = opts.length > 6 ? 'flex' : 'none';
    const q = kw.trim().toLowerCase();
    const filtered = opts.filter(o => !q || o.textContent.toLowerCase().includes(q) || (o.value || '').toLowerCase().includes(q));
    if (!filtered.length) {
      listEl.innerHTML = '<div class="ui-sel-empty">无匹配项</div>';
      return;
    }
    listEl.innerHTML = filtered.map(o => {
      const on = o.value === sel.value;
      const tag = o.value === '' ? '<span class="uso-tag">默认</span>' : '';
      return `<button type="button" class="ui-sel-opt ${on ? 'on' : ''}" data-v="${esc(o.value)}">
        <span class="uso-txt" title="${esc(o.textContent)}">${esc(o.textContent)}</span>${tag}${checkSvg}
      </button>`;
    }).join('');
    listEl.querySelectorAll('.ui-sel-opt').forEach(ob => {
      ob.onclick = () => {
        sel.value = ob.dataset.v;
        sel.dispatchEvent(new Event('change', { bubbles: true }));
        wrap.classList.remove('open');
        syncLabel();
      };
    });
  };

  btn.onclick = (e) => {
    e.stopPropagation();
    const wasOpen = wrap.classList.contains('open');
    document.querySelectorAll('.ui-sel.open').forEach(x => x.classList.remove('open'));
    if (!wasOpen) {
      wrap.classList.add('open');
      if (qEl) qEl.value = '';
      renderList('');
      if (qEl && searchWrap && searchWrap.style.display !== 'none') setTimeout(() => qEl.focus(), 20);
    }
  };
  pop.onclick = e => e.stopPropagation();
  if (qEl) {
    qEl.oninput = e => renderList(e.target.value);
    qEl.onkeydown = e => { if (e.key === 'Escape') wrap.classList.remove('open'); };
  }
  sel.addEventListener('change', () => { syncLabel(); if (wrap.classList.contains('open')) renderList(qEl?.value || ''); });
  new MutationObserver(() => { syncLabel(); if (wrap.classList.contains('open')) renderList(qEl?.value || ''); })
    .observe(sel, { childList: true, subtree: true, attributes: true });
  syncLabel();
}
document.addEventListener('click', () => document.querySelectorAll('.ui-sel.open').forEach(x => x.classList.remove('open')));

/* ═══ Skill 市场 ═══ */
// ── 智能对话：全局会话状态（页面切换不丢失）──
let orch = { id: null, title: "新对话", loading: false, messageId: null };
let orchSessions = [];                // 会话列表
let orchStreamAbort = null;           // 当前 SSE 请求的 AbortController
let orchAbortReason = '';             // 'leave'（切页/切会话）| 'cancel'（用户点击停止）
const ORCH_CACHE = {};                // session_id -> history（切页保留）
const ORCH_QUEUES = {};               // session_id -> [{id, text}] 待发消息队列（可编辑/删除）

/* ── 待发队列操作 ── */
function orchQueue(sid) { return ORCH_QUEUES[sid] || (ORCH_QUEUES[sid] = []); }
function renderQueue() {
  const wrap = document.querySelector('#send-queue');
  if (!wrap) return;
  const q = orchQueue(orch.id);
  wrap.classList.toggle('hidden', q.length === 0);
  const list = wrap.querySelector('.q-list');
  if (!list) return;
  list.innerHTML = q.map((m, i) => `
    <div class="q-item" data-qid="${esc(m.id)}">
      <span class="qn">${i + 1}.</span>
      <span class="qt" title="点击编辑">${esc(m.text)}</span>
      <button class="qop" title="编辑" onclick="orchEditQueued('${esc(m.id)}',this)">编辑</button>
      <button class="qop del" title="删除" onclick="orchDelQueued('${esc(m.id)}')">删除</button>
    </div>`).join('');
}
function orchEditQueued(qid, btn) {
  const item = btn.closest('.q-item');
  const span = item.querySelector('.qt');
  const q = orchQueue(orch.id), msg = q.find(m => m.id === qid);
  if (!msg) return;
  const input = document.createElement('input');
  input.className = 'qt'; input.value = msg.text;
  span.replaceWith(input);
  input.focus(); input.select();
  const save = () => {
    const v = input.value.trim();
    if (v) msg.text = v;
    renderQueue();
  };
  input.onblur = save;
  input.onkeydown = e => {
    if (e.key === 'Enter') { e.preventDefault(); save(); }
    if (e.key === 'Escape') renderQueue();
  };
}
function orchDelQueued(qid) {
  ORCH_QUEUES[orch.id] = orchQueue(orch.id).filter(m => m.id !== qid);
  renderQueue();
}
function orchClearQueue() { ORCH_QUEUES[orch.id] = []; renderQueue(); }
function orchEnqueue(text) {
  orchQueue(orch.id).push({ id: 'q' + Date.now() + Math.floor(Math.random()*1000), text });
  renderQueue();
}

/* ── 会话管理 ── */
let orchListGen = 0;  // 会话列表加载代次：避免旧请求覆盖新状态
let ORCH_RUNNING = new Set();  // 正在执行任务的会话（转圈状态）
let ORCH_UNREAD = new Set();   // 任务在后台完成、用户尚未回去查看的会话（绿点）
async function orchLoadSessions() {
  const gen = ++orchListGen;
  try {
    const [list, running] = await Promise.all([
      api('/orchestrator/sessions'),
      api('/orchestrator/running').catch(() => []),
    ]);
    if (gen !== orchListGen) return;
    orchSessions = list;
    window.__orchRunningList = running || [];   // 供切回会话时重建进行中的任务
    const runningSet = new Set((running || []).map(x => x.session_id));
    // 之前在跑、现在不在跑的会话 = 任务刚完成；若用户不在该会话，标为未读（绿点）
    for (const sid of ORCH_RUNNING) {
      if (!runningSet.has(sid) && sid !== orch.id) ORCH_UNREAD.add(sid);
    }
    ORCH_RUNNING = runningSet;
  } catch (e) { if (gen === orchListGen) orchSessions = []; }
  if (gen === orchListGen) renderSessList();
}
function renderSessList() {
  const el = document.querySelector('#sess-list');
  if (!el) return;
  el.innerHTML = orchSessions.length ? orchSessions.map(s => {
    const running = ORCH_RUNNING.has(s.session_id);
    const unread = !running && ORCH_UNREAD.has(s.session_id) && s.session_id !== orch.id;
    const statusIcon = running
      ? '<span class="spin" style="width:11px;height:11px;border-width:1.5px" title="任务执行中"></span>'
      : (unread ? '<span class="sess-done" title="任务已完成，点击查看"></span>' : '<span class="sess-status-empty"></span>');
    return `<div class="sess-item ${s.session_id === orch.id ? 'on' : ''}" onclick="orchSwitch('${esc(s.session_id)}')">
      ${statusIcon}<span class="st" title="${esc(s.title)}">${esc(s.title || '新对话')}</span>
      <button class="del" title="删除会话" onclick="event.stopPropagation();orchDelete('${esc(s.session_id)}')">删除</button>
    </div>`;
  }).join('') : '<div style="padding:14px;color:var(--dim);font-size:12px;text-align:center">暂无历史会话</div>';
}
async function orchNew() {
  orchStop(false);
  try {
    const s = await api('/orchestrator/sessions', {method:'POST'});
    orch = { id: s.session_id, title: s.title || '新对话', loading: false, messageId: null };
    localStorage.setItem('aws-orch-sid', s.session_id);
    ORCH_CACHE[s.session_id] = [];
    await orchLoadSessions();
    orchRenderHistory();
    document.querySelector('#orch-in')?.focus();
  } catch (e) { toast('新建会话失败: ' + e.message, '操作失败'); }
}
async function orchSwitch(sid) {
  if (sid === orch.id) return;
  orchStop(false);   // 只断开当前 SSE，不取消后台任务
  ORCH_UNREAD.delete(sid);   // 用户回到该会话：绿点（未读完成）消失
  orch = { id: sid, title: '对话', loading: false, messageId: null };
  localStorage.setItem('aws-orch-sid', sid);
  // 先拉权威历史，再拉最新 running 列表，确保对账与重连快照无时间差
  try {
    const d = await api(`/orchestrator/sessions/${sid}`);
    ORCH_CACHE[sid] = d.history || [];
  }
  catch (e) { if (!ORCH_CACHE[sid]) ORCH_CACHE[sid] = []; }
  await orchLoadSessions();
  if (orch.id !== sid) return;
  const s = orchSessions.find(x => x.session_id === sid);
  if (s) orch.title = s.title || '新对话';
  orchRenderHistory();
  // 若该会话有后台任务正在执行：重建"进行中"消息并重连 SSE 续读实时思考与正文
  const runInfo = (window.__orchRunningList || []).find(x => x.session_id === sid);
  if (runInfo && runInfo.messages && runInfo.messages.length) {
    orchResumeRunning(sid, runInfo.messages[0]);
  }
  renderQueue();
  // 切回会话时：若该会话有待发消息且当前空闲，自动消费（切走期间不会消费）
  if (!orch.loading && orchQueue(sid).length) {
    const next = orchQueue(sid).shift();
    renderQueue();
    if (next) { const i = document.querySelector('#orch-in'); if (i) { i.value = next.text; orchSend(); } }
  }
  document.querySelector('#orch-in')?.focus();
}
async function orchDelete(sid) {
  if (!(await modal({ title: '删除会话', message: '确定删除这个会话？删除后无法恢复。', confirmText: '删除', danger: true }))) return;
  try {
    await api(`/orchestrator/sessions/${sid}`, {method:'DELETE'});
    delete ORCH_CACHE[sid];
    // 立即从本地列表移除并重绘，避免异步刷新覆盖导致快速连删丢失
    orchSessions = orchSessions.filter(s => s.session_id !== sid);
    delete ORCH_QUEUES[sid];
    if (sid === orch.id) {
      // 当前会话被删：直接切换到列表首项或新建，不用旧的 orch.id 状态
      orch = { id: null, title: '新对话', loading: false, messageId: null };
      if (orchSessions.length) {
        const s = orchSessions[0];
        orch = { id: s.session_id, title: s.title || '新对话', loading: false, messageId: null };
      } else {
        const created = await api('/orchestrator/sessions', {method:'POST'});
        orch = { id: created.session_id, title: created.title || '新对话', loading: false, messageId: null };
        orchSessions = [{session_id: created.session_id, title: created.title || '新对话'}];
      }
      orchRenderHistory();
    }
    renderSessList();
    renderQueue();
    orchUpdateSendState();
    // 后台再拉一次权威列表校正（不阻塞交互）
    orchLoadSessions();
  } catch (e) { toast('删除失败: ' + e.message, '操作失败'); }
}
function orchStop(cancelBackend = true) {
  // 中断 SSE 连接：前端不再消费事件；后台任务是否取消取决于 cancelBackend。
  // 切换会话/切换页面时传 false —— 任务在后台继续执行并落库，绝不标记为已中断。
  orchAbortReason = cancelBackend ? 'cancel' : 'leave';
  if (orchStreamAbort) { orchStreamAbort.abort(); orchStreamAbort = null; }
  if (cancelBackend && orch.messageId) {
    api(`/orchestrator/messages/${orch.messageId}/cancel`, {method:'POST'}).catch(() => {});
    orch.messageId = null;
  }
  orch.loading = false;
  orchUpdateSendState();
}
function orchUpdateSendState() {
  const go = document.querySelector('#orch-go');
  const stop = document.querySelector('#orch-stop');
  // 处理中仍可发送：新消息进入待发队列（需求：用户可继续提问）
  if (go) go.disabled = !orch.id;
  if (stop) stop.classList.toggle('hidden', !orch.loading);
}

/* ── 历史渲染 ── */
function orchRenderHistory() {
  const body = document.querySelector('#orch-body');
  if (!body) return;
  const hist = ORCH_CACHE[orch.id] || [];
  const pairs = [];
  for (let i = 0; i < hist.length; i++) {

      pairs.push({user: hist[i].content, ai: (hist[i+1] && hist[i+1].role === 'assistant') ? hist[i+1] : null});
      if (hist[i+1] && hist[i+1].role === 'assistant') i++;
    } else if (hist[i].role === 'assistant') {

  if (pairs.length === 0) {
    body.innerHTML = `<div class="welcome">
      <div class="w-emblem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg></div>
      <div class="big">有什么可以帮你？</div>

    if (p.ai) {

        <div class="content">${fmtText(p.ai.content || '')}${renderFiles(p.ai.files)}</div></div>`;
    }

  }).join('');
  body.scrollTop = body.scrollHeight;
}
window.quickAsk = t => { const i = document.querySelector('#orch-in'); if (i) { i.value = t; orchSend(); } };

// 净化输出：去掉 Markdown 强调符、标题符、列表符，保留人类可读的普通文本
const fmtText = t => {
  const s = String(t ?? '')
    .replace(/\*\*/g, '').replace(/__/g, '')
    .replace(/^#{1,6}\s*/gm, '')
    .replace(/^\s*[-*+]\s+/gm, '')
    .replace(/`([^`]*)`/g, '$1');
  return esc(s).replace(/\n/g, '<br>');
};
const STAGE_TXT = {thinking:'思考中…'};
// 交付文件卡片：按文件类型着色 + 图标 + 格式标签 + 悬浮下载动效

  return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
}

    file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>',

  if (['docx','doc','rtf'].includes(ext)) return { cls:'df-word', label:ext.toUpperCase(), icon:icons.doc };
  if (['xlsx','xls','csv','tsv'].includes(ext)) return { cls:'df-excel', label:ext.toUpperCase(), icon:icons.sheet };

  if (['json','yaml','yml','xml','toml'].includes(ext)) return { cls:'df-json', label:ext.toUpperCase(), icon:icons.json };
  if (['md','markdown','txt','log'].includes(ext)) return { cls:'df-text', label:ext.toUpperCase(), icon:icons.doc };

  if (['zip','tar','gz','rar','7z'].includes(ext)) return { cls:'df-zip', label:ext.toUpperCase(), icon:icons.zip };

function renderFiles(files) {

// 子 Agent 过程展示：把子 Agent 的实时思考/工具事件追加到独立区块
function appendSubEvent(turn, ev) {
  let box = turn.querySelector('.sub-process');
  if (!box) {
    turn.insertAdjacentHTML('afterbegin', '<div class="sub-process"></div>');
    box = turn.querySelector('.sub-process');
  }
  box.classList.remove('hidden');
  const who = ev.sub_agent || '子 Agent';
  let line = '';
  if (ev.type === 'thought') line = `思考：${esc(ev.text||'')}`;
  else if (ev.type === 'reasoning') line = `思考：${esc(ev.delta||ev.text||'')}`;
  else if (ev.type === 'tool') line = `调用工具 <b>${esc(ev.action||'')}</b>`;
  else if (ev.type === 'observation') line = `工具结果：${esc((ev.text||'').slice(0,300))}`;
  else if (ev.type === 'content') line = `输出：${esc((ev.delta||ev.text||'').slice(0,300))}`;
  if (!line) return;
  const row = document.createElement('div');
  row.className = 'sub-row';
  row.innerHTML = `<span class="sub-tag">${esc(who)}</span><span>${line}</span>`;
  box.appendChild(row);
  const b = turn.closest('#orch-body') || document.querySelector('#orch-body');
  if (b) b.scrollTop = b.scrollHeight;
}

// 统一事件渲染引擎：orchSend 与 orchResumeRunning（快照回放 + SSE 续读）共用，确保切页/切会话零丢失
function createOrchTurn(body, initialStatus = '思考中…') {
  const turn = document.createElement('div');
  turn.className = 'turn ai';
  turn.innerHTML = `<div class="sub-process hidden"></div>
    <details class="think hidden"><summary><span class="caret">▸</span><span class="label">思考中…</span><span class="line"></span></summary><div class="think-body"></div></details>
    <div class="content"><span class="spin"></span> <span style="color:var(--dim);font-size:12.5px">${esc(initialStatus)}</span></div>`;
  body.appendChild(turn);
  body.scrollTop = body.scrollHeight;
  return turn;
}
function applyOrchEvent(turn, state, ev, body, isReplay = false) {
  const thinkEl = turn.querySelector('details.think');
  const thinkBody = turn.querySelector('.think-body');
  const thinkLabel = turn.querySelector('.think .label');
  const contentEl = turn.querySelector('.content');

  if (ev.type === 'queued') {
    if (ev.message_id) state.messageId = ev.message_id;
  } else if (ev.type === 'delegation') {
    const html = `已委托子 Agent <b>${esc(ev.agent)}</b> 处理${ev.reason ? ' · ' + esc(ev.reason) : ''}`;
    const existing = turn.querySelector('.deli');
    if (existing) existing.innerHTML = html;
    else turn.insertAdjacentHTML('afterbegin', `<div class="deli">${html}</div>`);
    if (ev.agent) {
      const idx = state.delegations.findIndex(d => d.agent === ev.agent);
      const item = { agent: ev.agent, state: ev.state, reason: ev.reason, task_id: ev.task_id };
      if (idx >= 0) state.delegations[idx] = item; else state.delegations.push(item);
    }
  } else if (ev.type === 'status') {
    thinkEl.classList.remove('hidden');
    if (!state.full && !state.done) thinkEl.classList.add('live');
    thinkLabel.textContent = STAGE_TXT[ev.stage] || ev.stage;
    if (ev.stage === 'delegating' && ev.agent) {
      if (!turn.querySelector('.deli')) {
        turn.insertAdjacentHTML('afterbegin', `<div class="deli">正在调用子 Agent <b>${esc(ev.agent)}</b>…</div>`);
      }
      if (!state.full) {
        contentEl.innerHTML = `<span class="spin"></span> <span style="color:var(--dim);font-size:12.5px">子 Agent <b>${esc(ev.agent)}</b> 处理中…</span>${renderFiles(state.files)}`;
      }
    }
  } else if (ev.phase === 'sub') {
    state.subEvents.push(ev);
    appendSubEvent(turn, ev);
  } else if (ev.type === 'reasoning') {
    thinkEl.classList.remove('hidden');
    thinkEl.classList.add('live');
    thinkLabel.textContent = state.subEvents.length ? '主 Agent 整理中…' : '思考中…';
    if (!thinkEl.open) thinkEl.open = true;
    state.rsn += ev.delta || '';
    thinkBody.textContent = state.rsn;
    if (!state.full) {
      contentEl.innerHTML = `<span class="spin"></span> <span style="color:var(--dim);font-size:12.5px">Agent 深度思考中…</span>${renderFiles(state.files)}`;
    }
  } else if (ev.type === 'content') {
    thinkEl.classList.remove('live');
    if (state.rsn) thinkLabel.textContent = '已深度思考';
    state.full += ev.delta || '';
    contentEl.innerHTML = fmtText(state.full) + '<span class="cursor"></span>' + renderFiles(state.files);
  } else if (ev.type === 'file') {
    const u = ev.url || ev.download_url;
    if (!u || !state.files.some(x => (x.url || x.download_url) === u)) state.files.push(ev);
    if (state.full) {
      contentEl.innerHTML = fmtText(state.full) + '<span class="cursor"></span>' + renderFiles(state.files);
    } else {
      contentEl.innerHTML = `<span class="spin"></span> <span style="color:var(--dim);font-size:12.5px">已生成文件，整理回复中…</span>` + renderFiles(state.files);
    }
  } else if (ev.type === 'canceled') {
    state.canceled = true;
    thinkEl.classList.remove('live');
    if (ev.partial && ev.partial.length > state.full.length) state.full = ev.partial;
  } else if (ev.type === 'error') {
    state.error = ev.message || '执行出错';
    thinkEl.classList.remove('live');
    contentEl.innerHTML += `<div style="color:var(--bad);margin-top:6px">${esc(state.error)}</div>`;
  } else if (ev.type === 'done') {
    state.done = true;
    thinkEl.classList.remove('live');
    if (state.rsn || ev.reasoning) thinkLabel.textContent = '已深度思考';
    if (ev.reply !== undefined && ev.reply !== null) state.full = ev.reply;
    if (ev.reasoning) state.rsn = ev.reasoning;
    if (ev.delegations && ev.delegations.length) state.delegations = ev.delegations;
    if (ev.sub_events && ev.sub_events.length) state.subEvents = ev.sub_events;
    if (ev.files && ev.files.length) {
      for (const f of ev.files) {
        const u = f.url || f.download_url;
        if (!u || !state.files.some(x => (x.url || x.download_url) === u)) state.files.push(f);
      }
    }
  }
  if (!isReplay && body) body.scrollTop = body.scrollHeight;
}

/* ── 发送消息（队列 + 流式 + 可中断）── */
async function orchSend() {
  const inp = document.querySelector('#orch-in'), text = inp.value.trim();
  if (!text || !orch.id) return;
  const sid = orch.id;   // 发起时的会话：完成后只在仍停留该会话时才写缓存/消费队列
  // LLM 正在处理：消息进入待发队列（可编辑/删除），不立即发送
  if (orch.loading) {
    orchEnqueue(text);
    inp.value = ''; inp.style.height = 'auto';
    return;
  }
  inp.value = ''; inp.style.height = 'auto';

  const body = document.querySelector('#orch-body');
  body.querySelector('.welcome')?.remove();
  body.insertAdjacentHTML('beforeend', `<div class="turn user"><div class="bubble">${fmtText(text)}</div></div>`);
  const turn = createOrchTurn(body, '思考中…');
  const contentEl = turn.querySelector('.content');

  orch.loading = true; orchAbortReason = ''; orchUpdateSendState();
  const myAbort = new AbortController();
  orchStreamAbort = myAbort;
  const state = { full: '', rsn: '', canceled: false, done: false, error: '', files: [], delegations: [], subEvents: [], messageId: null };
  let leftPage = false;

  try {
    const resp = await fetch(`/orchestrator/sessions/${sid}/chat/stream`, {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({text}), signal: myAbort.signal,
    });
    if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);
    const reader = resp.body.getReader(), dec = new TextDecoder();
    let buf = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
        for (const line of frame.split('\n')) {
          if (!line.startsWith('data:')) continue;
          let ev; try { ev = JSON.parse(line.slice(5)); } catch { continue; }
          if (ev.type === 'queued' && ev.message_id) orch.messageId = ev.message_id;
          applyOrchEvent(turn, state, ev, body, false);
        }
      }
    }
  } catch (e) {
    if (e.name === 'AbortError') {
      // 区分「切换页面/切换会话」与「用户点击停止」：切走时后台任务继续执行，绝不标记已中断或写脏缓存
      if (orchAbortReason === 'leave') {
        leftPage = true;
      } else {
        state.canceled = true;
      }
    } else {
      state.error = '出错了: ' + e.message;
      contentEl.innerHTML += `<div style="color:var(--bad);margin-top:6px">${esc(state.error)}</div>`;
    }
  }

  // 因切换页面或切换会话断开 SSE：安静退出，后台任务仍在运行，下次切回由 orchResumeRunning 无缝接管
  if (leftPage) return;

  turn.querySelector('details.think')?.classList.remove('live');
  contentEl.innerHTML = fmtText(state.full || '') + renderFiles(state.files)
    + (state.canceled ? '<div class="d" style="color:var(--dim);margin-top:6px">已中断</div>' : '')
    + (state.error ? `<div style="color:var(--bad);margin-top:6px">${esc(state.error)}</div>` : '');

  // 持久化到该会话的本地缓存
  const cache = ORCH_CACHE[sid] || (ORCH_CACHE[sid] = []);
  cache.push({role:'user', content:text});
  cache.push({
    role:'assistant', content: state.full, reasoning: state.rsn,
    files: state.files, delegations: state.delegations, sub_events: state.subEvents,
  });

  const stillHere = orch.id === sid && !!document.querySelector('#orch-body');
  if (stillHere && orchStreamAbort === myAbort) {
    orch.loading = false; orch.messageId = null; orchStreamAbort = null;
  }
  if (stillHere) {
    orchUpdateSendState();
    orchLoadSessions();
    const inpEl = document.querySelector('#orch-in');
    if (inpEl) inpEl.focus();
    // 仅在正常完成（非用户主动中断）时自动发送队列中的下一条
    if (!state.canceled) {
      const next = orchQueue(sid).shift();
      renderQueue();
      if (next && inpEl) {
        inpEl.value = next.text;
        orchSend();
      }
    }
  }
}


// 切回正在执行的会话：拉取最新事件快照重建实时思考/子 Agent 过程，并重连 SSE 续读后续事件
async function orchResumeRunning(sid, m) {
  const body = document.querySelector('#orch-body'); if (!body || !m) return;
  // 拉取该消息的最新原子快照，避免与 /sessions/{sid} 对账之间产生事件缺口
  let snap = m;
  try {
    const fresh = await api(`/orchestrator/messages/${m.id}/snapshot`);
    if (fresh && fresh.id) snap = fresh;
  } catch (e) {}
  // 拉快照期间用户可能已切走
  if (orch.id !== sid || !document.querySelector('#orch-body')) return;

  const curBody = document.querySelector('#orch-body');
  curBody.querySelector('.welcome')?.remove();

  // 避免重复渲染用户消息（若服务端历史末尾尚未包含该消息，才追加用户气泡）
  const msgText = snap.text || m.text || '';
  const lastUserBubble = [...curBody.querySelectorAll('.turn.user .bubble')].pop();
  const lastIsSameUser = lastUserBubble && lastUserBubble.closest('.turn.user') === curBody.lastElementChild
    && lastUserBubble.textContent.trim() === msgText.trim();
  if (!lastIsSameUser && msgText) {
    curBody.insertAdjacentHTML('beforeend', `<div class="turn user"><div class="bubble">${fmtText(msgText)}</div></div>`);
  }

  const turn = createOrchTurn(curBody, '任务执行中…');
  turn.classList.add('resuming');
  const contentEl = turn.querySelector('.content');

  // 用统一事件引擎回放已有全部事件（含 status / delegation / 子 Agent 思考与工具 / 主 Agent 思考 / 正文 / 文件）
  const state = { full: '', rsn: '', canceled: false, done: false, error: '', files: [], delegations: [], subEvents: [], messageId: snap.id };
  const snapEvents = snap.events || [];
  for (const ev of snapEvents) {
    applyOrchEvent(turn, state, ev, curBody, true);
  }
  // 若回放后仍在思考阶段且尚未收到 done，确保思考块保持展开 + 脉冲状态，让用户一眼看见实时思考过程
  const thinkEl = turn.querySelector('details.think');
  if (thinkEl && !state.done && !state.canceled && (state.rsn || !state.full)) {
    if (state.rsn) thinkEl.open = true;
    if (!state.full) thinkEl.classList.add('live');
  }
  curBody.scrollTop = curBody.scrollHeight;

  // 若快照里已经包含 done/canceled（刚好在切回瞬间完成），直接与后端历史对账即可
  if (state.done || state.canceled || snap.state === 'done' || snap.state === 'canceled' || snap.state === 'failed') {
    thinkEl?.classList.remove('live');
    contentEl.innerHTML = fmtText(state.full || '') + renderFiles(state.files)
      + (state.canceled ? '<div class="d" style="color:var(--dim);margin-top:6px">已中断</div>' : '');
    if (orch.id === sid && document.querySelector('#orch-body')) {
      orch.loading = false; orch.messageId = null; orchUpdateSendState();
      try {
        const d = await api(`/orchestrator/sessions/${sid}`);
        if (d.history && d.history.length && orch.id === sid && document.querySelector('#orch-body')) {
          ORCH_CACHE[sid] = d.history;
          orchRenderHistory();
        }
      } catch (e) {}
      orchLoadSessions();
    }
    return;
  }

  orch.loading = true; orch.messageId = snap.id; orchAbortReason = ''; orchUpdateSendState();
  // 重连 SSE：从快照长度起续读，保证零丢帧、零重复
  const fromIndex = snapEvents.length;
  const myAbort = new AbortController();
  orchStreamAbort = myAbort;
  let leftPage = false;

  try {
    const resp = await fetch(`/orchestrator/messages/${snap.id}/stream?from_index=${fromIndex}`,
                             {signal: myAbort.signal});
    if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);
    const reader = resp.body.getReader(), dec = new TextDecoder();
    let buf = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
        for (const line of frame.split('\n')) {
          if (!line.startsWith('data:')) continue;
          let ev; try { ev = JSON.parse(line.slice(5)); } catch { continue; }
          applyOrchEvent(turn, state, ev, curBody, false);
        }
      }
    }
  } catch (e) {
    if (e.name === 'AbortError') {
      if (orchAbortReason === 'leave') leftPage = true;
      else state.canceled = true;
    } else {
      state.error = '重连异常: ' + e.message;
    }
  }

  // 用户在重连期间再次切页/切会话：直接安静退出，不覆盖 DOM、不误判任务完成
  if (leftPage || orch.id !== sid || !document.querySelector('#orch-body')) return;

  turn.querySelector('details.think')?.classList.remove('live');
  contentEl.innerHTML = fmtText(state.full || (state.canceled ? '' : '任务已完成')) + renderFiles(state.files)
    + (state.canceled ? '<div class="d" style="color:var(--dim);margin-top:6px">已中断</div>' : '')
    + (state.error ? `<div style="color:var(--bad);margin-top:6px">${esc(state.error)}</div>` : '');

  if (orchStreamAbort === myAbort) {
    orch.loading = false; orch.messageId = null; orchStreamAbort = null;
  }
  orchUpdateSendState();
  try {
    const d = await api(`/orchestrator/sessions/${sid}`);
    const hist = d.history || [];
    if (hist.length && orch.id === sid && document.querySelector('#orch-body')) {
      ORCH_CACHE[sid] = hist;
      orchRenderHistory();
    }
  } catch (e) {}
  orchLoadSessions();
  // 若队列中还有待发消息且非主动中断，继续消费
  if (!state.canceled && orch.id === sid && !orch.loading && orchQueue(sid).length) {
    const next = orchQueue(sid).shift();
    renderQueue();
    const inpEl = document.querySelector('#orch-in');
    if (next && inpEl) { inpEl.value = next.text; orchSend(); }
  }
}

window.mcpImport = async () => {
  const cfg = $('#mcp-config')?.value || '';
  const box = $('#mcp-msg');
  if (!cfg.trim()) { flashMsg(box, false, '请先粘贴 MCP 配置 JSON'); return; }
  box.innerHTML = loading('正在解析配置并接入 MCP Server…');
  try {
    const r = await api('/mcp/import', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({config: cfg})});
    const ok = r.results.filter(x=>x.ok).length, fail = r.results.length - ok;
    const detail = r.results.map(x => `${x.ok?'✓':'✗'} ${x.name}${x.ok?` (${x.tool_count} 工具)`:`: ${(x.error||'').slice(0,40)}`}`).join('；');
    flashMsg(box, fail===0, `解析 ${r.imported} 个，成功 ${ok}，失败 ${fail}。${detail}`, 12000);
    await mcpLoad();
  } catch (e) { flashMsg(box, false, e.message, 8000); }
};
window.mcpRefresh = async (id, btn) => {
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin" style="width:11px;height:11px;border-width:1.5px"></span> 刷新中…'; }
  try {
    const r = await api(`/mcp/servers/${id}/refresh`, {method:'POST'});
    await mcpLoad();   // 卡片工具数/状态/清单同步更新
    if (r.ok) toastQuick(`刷新成功，发现 ${r.tool_count} 个工具`, true);
    else toastQuick(`刷新失败：${(r.error||'').slice(0,120)}`, false);
  } catch (e) { toastQuick(`刷新失败：${e.message}`, false); }
};

function renderPGChat() {
  const body = $('#pg-body'); if (!body) return;
  const hist = PG_CACHE[PG_AGENT_ID] || [];
  // 与智能对话使用同一套结构：.turn.user/.bubble + .turn.ai/.content，思考块可展开
  const pairs = [];
  for (let i = 0; i < hist.length; i++) {
    if (hist[i].role === 'user') {
      const nx = hist[i+1];
      pairs.push({user: hist[i].content,
        ai: (nx && nx.role === 'assistant') ? nx : null,
        pending: (nx && nx.role === 'pending')});
      if (nx && (nx.role === 'assistant' || nx.role === 'pending')) i++;
    } else if (hist[i].role === 'assistant') {
      pairs.push({user: null, ai: hist[i], pending: false});
    }
  }
  body.innerHTML = pairs.length
    ? pairs.map(p => {
        let h = '';
        if (p.user) h += `<div class="turn user"><div class="bubble">${fmtText(p.user)}</div></div>`;
        if (p.pending) {
          const live = (window.__pgLive && window.__pgLive.aid === PG_AGENT_ID) ? window.__pgLive.events : [];
          const rsn = live.filter(e => e.type === 'reasoning' || e.type === 'thought').map(e => e.text || '').join('\n');
          const cur = live.filter(e => e.type === 'tool').map(e => '调用 ' + e.action).join(' · ');
          const liveFiles = live.filter(e => e.type === 'file');
          h += `<div class="turn ai">`
            + (rsn ? `<details class="think" open><summary><span class="caret">▸</span><span class="label">思考中…</span><span class="line"></span></summary><div class="think-body">${esc(rsn)}</div></details>` : '')
            + `<div class="content"><span class="spin"></span> <span style="color:var(--dim);font-size:12.5px">${cur || 'Agent 思考中…'}</span>${renderFiles(liveFiles)}</div></div>`;
        } else if (p.ai) {
          const rsn = (p.ai.thoughts || []).join('\n').trim();
          h += `<div class="turn ai">`
            + (rsn ? `<details class="think"><summary><span class="caret">▸</span><span class="label">已深度思考</span><span class="line"></span></summary><div class="think-body">${esc(rsn)}</div></details>` : '')
            + `<div class="content">${fmtText(p.ai.content || '')}${renderFiles(p.ai.files)}</div></div>`;
        }
        return h;
      }).join('')
    : '<div class="bubble ai">输入消息开始调试。这个 Agent 的对话会保留，直到你切换测试其他 Agent。</div>';
  body.scrollTop = body.scrollHeight;
  // 恢复该 Agent 的最近一次轨迹
  const last = [...hist].reverse().find(m => m.role === 'assistant' && m.steps);
  const tr = $('#pg-trace');
  if (tr) tr.innerHTML = last ? renderPGTrace(last) : '';
  const goBtn = $('#pg-go');
  if (goBtn) goBtn.disabled = hist.some(m => m.role === 'pending');
}
function renderPGTrace(run) {
  const steps = run.steps || [];
  const isLoop = steps.some(s => s.thought !== undefined || s.observation !== undefined);
  if (isLoop) {
    // 独立智能体工作循环轨迹
    const blocks = steps.map(s => `
      <div class="card" style="margin-bottom:8px">
        <div class="t" style="font-size:12.5px">步骤 ${s.step} · ${esc(s.action||'-')}
          ${s.action==='final'?'<span class="tag ok">最终答案</span>':s.action&&s.action!=='fallback'?'<span class="tag acc">工具调用</span>':''}</div>
        ${s.thought ? `<div class="d" style="font-size:12px;margin-top:4px"><b>思考：</b>${esc(s.thought)}</div>` : ''}
        ${s.action_args && Object.keys(s.action_args).length ? `<div class="d" style="font-size:11.5px;color:var(--dim)">参数：${esc(JSON.stringify(s.action_args))}</div>` : ''}
        ${s.observation ? `<div class="d" style="font-size:12px;margin-top:4px;white-space:pre-wrap"><b>工具结果：</b>${esc(s.observation.slice(0,300))}</div>` : ''}
      </div>`).join('');
    return `<h3 class="sect">工作轨迹 <span class="tag ${run.status==='succeeded'?'ok':'bad'}">${run.status}</span></h3>${blocks}`;
  }
  // 旧格式兼容
  const rows = steps.map(s=>`<tr><td>${esc(s.step)}</td><td>${s.ms??''}ms</td><td style="color:var(--dim)">${esc(JSON.stringify(s.result||s.plugin||s.titles||s.model||s.error||''))}</td></tr>`).join('');
  return `<h3 class="sect">执行轨迹 <span class="tag ${run.status==='succeeded'?'ok':'bad'}">${run.status}</span> <span class="tag">tokens ${run.token_usage?.input_tokens||0}→${run.token_usage?.output_tokens||0}</span></h3>
    <div class="card"><table><tr><th>步骤</th><th>耗时</th><th>详情</th></tr>${rows}</table></div>`;
}
